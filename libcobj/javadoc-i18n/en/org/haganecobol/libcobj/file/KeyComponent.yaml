# Translations of the Javadoc comments. Generated and updated by
# `./gradlew syncJavadocTranslations` in libcobj/.
# Fill in `en` for each `ja`. Do not edit `ja` by hand:
# it must match the Japanese text in the source file.
- ja: |-
    INDEXEDファイルのSPLIT KEYを構成する1つの要素を表す。

    <p>COBOLでは、レコードキーを連続しない複数のフィールドから構成できる（SPLIT KEY。例：{@code RECORD KEY IS K = F1 F2
    ...}）。その構成フィールド1つ1つが{@code KeyComponent}で表現される。コンパイラ（{@code
    cobj}）は、2つ以上の要素を持つキーごとに{@code KeyComponent}の配列を生成し、{@link
    CobolFileKey#setComponent(KeyComponent[])}を通じて所有者である{@link CobolFileKey}に格納する。
  en: |-
    Represents one component of a SPLIT KEY of an INDEXED file.

    <p>In COBOL, a record key can be composed of multiple non-contiguous fields (SPLIT KEY, e.g.
    {@code RECORD KEY IS K = F1 F2 ...}). Each of those component fields is represented by a
    {@code KeyComponent}. The compiler ({@code cobj}) generates an array of {@code KeyComponent}s for each
    key with two or more components, and stores it in the owning {@link CobolFileKey} through
    {@link CobolFileKey#setComponent(KeyComponent[])}.
- ja: |-
    このキー要素を構成するCOBOLフィールド。
  en: |-
    The COBOL field that makes up this key component.
- ja: |-
    レコード先頭からのこの要素の0始まりのバイトオフセット。
  en: |-
    The zero-based byte offset of this component from the beginning of the record.
