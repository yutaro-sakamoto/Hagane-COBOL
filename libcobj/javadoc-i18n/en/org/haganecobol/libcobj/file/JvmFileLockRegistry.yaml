- ja: |-
    順編成・行順編成・相対編成ファイルの、実行単位(スレッド)間およびプロセス間のロックを管理する台帳。

    <p>OSのファイルロック({@link FileChannel#tryLock})はJVM単位で管理されており、 同一JVM内で既にロックされている範囲を別のチャネルでロックしようとすると
    (共有ロック同士でも){@link OverlappingFileLockException}がスローされる。 そこでOSのロックはファイルごとにこの台帳が1つだけ保持し、
    同一JVM内のスレッド間の競合は台帳の保持者一覧で、別プロセスとの競合はOSのロックで、 それぞれ別プロセスからのOPENと同じ規則(共有同士は共存、排他が絡めばFILE STATUS
    61)で判定する。

    <p>OSのロックは、この台帳が専用に開いたチャネル上の、ファイル終端よりはるか先の小さな範囲
    ({@link #MAIN_POSITION})に取得する。範囲が実データと重ならないため、ロックが必須(mandatory)である
    Windowsでも保持者自身の読み書きを一切妨げず、また保持者がファイルをクローズしてもロックは
    台帳のチャネル上で生き続けるので、ロックの引き継ぎ(解放と取り直しの隙間)が存在しない。
    C版opensource COBOLのfcntlロック(offset 0から無限大)や旧実装の全域ロック([0, Long.MAX_VALUE))は
    この範囲とも重なるため、それらとの相互検知は保たれる。

    <p>多くのOS(Linuxのfcntlロックなど)では、あるプロセスがファイルに対して持つロックは、そのプロセスが
    <b>同じファイルを指すどのディスクリプタを閉じても</b>すべて解放される({@link java.nio.channels.FileLock}の
    Javadocにも明記されている)。このため、ロックを保持している間は、このJVMの誰もそのファイルのチャネルを
    閉じてはならない。保持者のCLOSEや、FILE STATUS 61で拒否されたOPENが手放すチャネルは、
    {@link #release(Lease, Closeable)}と{@link #closeFor(String, Closeable)}を通じて台帳が預かり、
    最後の保持者が解放してOSのロックを手放すときにまとめて閉じる。 保持者が絶えず入れ替わって最後の保持者が
    現れない場合でも預かるチャネルが増え続けないよう、このJVMでのファイルのオープンは
    {@link #openChannel}と{@link #openRandomAccessFile}を通して行い、預かっているチャネルのうち
    同じモードで開いたものがあれば新たに開かずに再利用する。これにより、預かるチャネルの数は
    そのファイルを同時にオープンしていた実行単位の数を超えない。

    <p>ロックのモード変更(同一実行単位がINPUTとOUTPUTを重ねてオープンした場合の昇格・降格)は、
    隣接するもう1つの範囲({@link #BRIDGE_POSITION})を橋渡しに使う: 目的のモードでブリッジ範囲を
    ロックしてから主範囲を取り直す。この台帳の全操作はブリッジ範囲を先にロックする規約なので、
    主範囲が一瞬解放されている間も、他のJVMや全域ロックを使うプロセスは必ずブリッジ範囲に衝突し、
    割り込むことができない。
  en: |-
    Registry that manages locks between run units (threads) and between processes for sequential, line
    sequential and relative files.

    <p>OS file locks ({@link FileChannel#tryLock}) are managed per JVM, and attempting to lock, through a
    different channel, a range that is already locked within the same JVM throws
    {@link OverlappingFileLockException} (even if both are shared locks). Therefore this registry alone
    holds the OS lock, one per file; conflicts between threads within the same JVM are decided by the
    registry's list of holders, and conflicts with other processes by the OS lock, each under the same
    rules as an OPEN from another process (shared locks coexist; if an exclusive lock is involved, FILE
    STATUS 61).

    <p>The OS lock is acquired on a small range far beyond the end of the file ({@link #MAIN_POSITION}),
    on a channel opened by this registry exclusively for that purpose. Since the range does not overlap
    the actual data, it does not interfere at all with the holders' own reads and writes even on Windows,
    where locks are mandatory; and since the lock lives on in the registry's channel even after a holder
    closes the file, there is no handover of the lock (no gap between release and reacquisition). The
    fcntl lock of the C version of opensource COBOL (from offset 0 to infinity) and the whole-range lock
    of the old implementation ([0, Long.MAX_VALUE)) also overlap this range, so mutual detection with them
    is preserved.

    <p>On many OSes (such as fcntl locks on Linux), all locks a process holds on a file are released when
    the process closes <b>any descriptor referring to the same file</b> (this is also stated in the
    Javadoc of {@link java.nio.channels.FileLock}). For this reason, while a lock is held, no one in this
    JVM may close a channel of that file. Channels given up by a holder's CLOSE or by an OPEN rejected
    with FILE STATUS 61 are kept by the registry through {@link #release(Lease, Closeable)} and
    {@link #closeFor(String, Closeable)}, and are closed all together when the last holder releases the
    lock and the OS lock is given up. So that the kept channels do not keep increasing even when holders
    are constantly replaced and no last holder ever appears, files in this JVM are opened through
    {@link #openChannel} and {@link #openRandomAccessFile}, and if one of the kept channels was opened in
    the same mode, it is reused instead of opening a new one. As a result, the number of kept channels
    does not exceed the number of run units that had the file open at the same time.

    <p>Changing the lock mode (upgrade or downgrade when the same run unit opens a file for both INPUT
    and OUTPUT) uses another adjacent range ({@link #BRIDGE_POSITION}) as a bridge: the bridge range is
    locked in the target mode, and then the main range is reacquired. Since by convention every operation
    of this registry locks the bridge range first, even while the main range is momentarily released,
    other JVMs and processes using whole-range locks always collide with the bridge range and cannot cut
    in.
