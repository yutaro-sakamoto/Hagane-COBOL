    読み取り専用のチャネルに排他ロックを取得しようとした場合
  en: |-
    if an attempt is made to acquire an exclusive lock on a read-only channel
- ja: |-
    ロック保持用のチャネルを開く。共有ロックには読み取り、排他ロックには書き込みの許可が要るため、
    読み書き両用で開き、許可がなければ読み取り専用、書き込み専用の順に代替する。
  en: |-
    Opens a channel for holding locks. Since a shared lock requires read permission and an exclusive
    lock requires write permission, the channel is opened for both reading and writing; if that is not
    permitted, it falls back to read-only, then write-only.
- ja: |-
    対象ファイルのパス
  en: |-
