    OSロックを取得する主範囲の開始位置。実データと重ならないよう、ファイル終端よりはるか先に置く。
  en: |-
    Start position of the main range on which the OS lock is acquired. Placed far beyond the end of
    the file so as not to overlap the actual data.
- ja: |-
    ロックのモード変更時に橋渡しとして使う範囲の開始位置。
  en: |-
    Start position of the range used as a bridge when changing the lock mode.
- ja: |-
    ロックする範囲の長さ。
  en: |-
    Length of the locked range.
- ja: |-
    ロックの保持者に渡す票。クローズ時に{@link #release(Lease, Closeable)}へ渡す。
  en: |-
    Lease given to a lock holder. Passed to {@link #release(Lease, Closeable)} on close.
- ja: |-
    この票を取得した実行単位(スレッド)
  en: |-
    The run unit (thread) that acquired this lease.
- ja: |-
    排他ロックとして要求されたかどうか
  en: |-
    Whether an exclusive lock was requested.
- ja: |-
    ファイルごとのロックの保持状況
  en: |-
    Lock holding status per file.
- ja: |-
    OSのロックを保持するための、台帳が所有する専用チャネル
  en: |-
    Dedicated channel owned by the registry for holding the OS lock.
- ja: |-
    主範囲に取得したOSのロック
  en: |-
    The OS lock acquired on the main range.
- ja: |-
    現在のOSロックが排他かどうか
  en: |-
    Whether the current OS lock is exclusive.
- ja: |-
    このJVM内での保持者
  en: |-
    Holders within this JVM.
- ja: |-
    OSのロックを失わないよう、ロックの解放まで閉じずに預かっているチャネル
  en: |-
    Channels kept without being closed until the lock is released, so as not to lose the OS lock.
- ja: |-
    正規化したパスをキーとするロックの台帳。このクラスのモニタで保護する。
  en: |-
    Lock registry keyed by normalized path. Guarded by the monitor of this class.
- ja: |-
    再利用できる形で開かれたファイル。預かったチャネルを次のオープンで使い回すために記録する。
  en: |-
    A file opened in a reusable form. Recorded so that a kept channel can be reused by the next
    open.
- ja: |-
    開いたときのモード。同じモードのオープンにだけ再利用する
  en: |-
    The mode in which it was opened. Reused only for opens in the same mode.
- ja: |-
    呼び出し元に返すオブジェクト(FileChannelまたはRandomAccessFile)
  en: |-
    The object returned to the caller (a FileChannel or a RandomAccessFile).
- ja: |-
    {@link #openChannel}と{@link #openRandomAccessFile}で開いたチャネルと、その開き方の対応。
    チャネルを閉じるときに取り除く。このクラスのモニタで保護する。
  en: |-
    Mapping from channels opened by {@link #openChannel} and {@link #openRandomAccessFile} to how they
    were opened. An entry is removed when its channel is closed. Guarded by the monitor of this class.
- ja: |-
    ファイルのロックを取得する。
  en: |-
    Acquires a lock on a file.
- ja: |-
    ロックするファイルのパス
  en: |-
    the path of the file to lock
- ja: |-
    共有ロックならtrue、排他ロックならfalse
  en: |-
    true for a shared lock, false for an exclusive lock
- ja: |-
    取得したロックの票。同一JVM内の他の実行単位またはほかのプロセスと競合して取得できない場合はnull
  en: |-
    the lease of the acquired lock, or null if it cannot be acquired because of a conflict with another
        run unit in the same JVM or with another process
- ja: |-
    書き込みが許可されていないファイルに排他ロックを取得しようとした場合
  en: |-
    if an attempt is made to acquire an exclusive lock on a file that is not writable
- ja: |-
    チャネルのオープンまたはロックに失敗した場合
  en: |-
    if opening or locking the channel fails
- ja: |-
    ロックを解放し、保持者が使っていたチャネルを閉じる。<br>
    このJVM内の最後の保持者が解放したときは、OSのロックを解放してから、預かっていたチャネルと あわせて閉じる。他の保持者が残っている場合は、チャネルを閉じるとOSのロックまで失われるため、
    閉じずに預かる。 排他を要求していた保持者が解放して共有の保持者だけが残った場合は、OSのロックを共有へ降格する。
  en: |-
    Releases the lock and closes the channel the holder was using.<br>
    When the last holder in this JVM releases the lock, the OS lock is released and then the channel is
    closed together with the kept channels. If other holders remain, closing the channel would also lose
    the OS lock, so the channel is kept without being closed. If a holder that requested an exclusive lock
    releases it and only shared holders remain, the OS lock is downgraded to shared.
- ja: |-
    {@link #acquire}で取得した票。nullの場合はresourceを閉じるだけ
  en: |-
    the lease acquired by {@link #acquire}; if null, resource is simply closed
- ja: |-
    保持者がファイルのI/Oに使っていたチャネル。nullでもよい
  en: |-
    the channel the holder was using for the file's I/O; may be null
- ja: |-
    ファイルをFileChannelとして開く。そのファイルについて預かっているチャネルのうち、同じオプションで
    開いたものがあれば、新たに開かずにそれを先頭の位置に戻して返す。
  en: |-
    Opens a file as a FileChannel. If one of the channels kept for that file was opened with the same
    options, it is rewound to the beginning and returned instead of opening a new one.
- ja: |-
    開くファイルのパス
  en: |-
    the path of the file to open
- ja: |-
    {@link FileChannel#open(Path, OpenOption...)}に渡すオプション
  en: |-
    the options passed to {@link FileChannel#open(Path, OpenOption...)}
- ja: |-
    開いたチャネル
  en: |-
    the opened channel
- ja: |-
    ファイルを開けなかった場合
  en: |-
    if the file cannot be opened
- ja: |-
    ファイルをRandomAccessFileとして開く。そのファイルについて預かっているもののうち、同じモードで
    開いたものがあれば、新たに開かずにそれを先頭の位置に戻して返す。預けるときは{@link
    RandomAccessFile#getChannel()}のチャネルを渡すこと。
  en: |-
    Opens a file as a RandomAccessFile. If one of the objects kept for that file was opened in the same
    mode, it is rewound to the beginning and returned instead of opening a new one. When handing it over
    to be kept, pass the channel of {@link RandomAccessFile#getChannel()}.
- ja: |-
    {@link RandomAccessFile}のモード("r"や"rw")
  en: |-
    the mode of {@link RandomAccessFile} ("r", "rw", etc.)
- ja: |-
    開いたファイル
  en: |-
    the opened file
- ja: |-
    預かっているチャネルから、指定したモードで開いたものを取り出す。なければnull。
  en: |-
    Takes out a kept channel that was opened in the specified mode, or null if there is none.
- ja: |-
    ロックを取得していないチャネル(FILE STATUS 61で拒否されたOPENのチャネルなど)を閉じる。<br>
    このJVMがそのファイルのロックを保持している間は、閉じるとOSのロックが失われるため、 ロックの解放まで閉じずに預かる。
  en: |-
    Closes a channel that holds no lock (such as the channel of an OPEN rejected with FILE STATUS
    61).<br>
    While this JVM holds the lock on that file, closing the channel would lose the OS lock, so it is kept
    without being closed until the lock is released.
- ja: |-
    チャネルが指すファイルのパス
  en: |-
    the path of the file the channel refers to
- ja: |-
    閉じるチャネル。nullの場合は何もしない
  en: |-
    the channel to close; does nothing if null
- ja: |-
    指定したファイルについて預かっているチャネルの数を返す(テスト用)。
  en: |-
    Returns the number of channels kept for the specified file (for testing).
- ja: |-
    ファイルのパス
  en: |-
    the path of the file
- ja: |-
    預かっているチャネルの数。ロックされていない場合は0
  en: |-
    the number of kept channels, or 0 if the file is not locked
- ja: |-
    エントリのOSロックのモードを変更する(昇格・降格)。<br>
    ブリッジ範囲を目的のモードでロックしてから主範囲を取り直すため、変更の間も 他のプロセスが割り込む隙間はない。
  en: |-
    Changes the mode of the OS lock of an entry (upgrade or downgrade).<br>
    Since the bridge range is locked in the target mode before the main range is reacquired, there is no
    gap for other processes to cut in during the change.
- ja: |-
    対象のエントリ
  en: |-
    the target entry
- ja: |-
    変更後のモード。共有ならtrue
  en: |-
    the new mode; true for shared
