    主キーのテーブルに指定したキーのレコードが存在するかを調べる。

    <p>{@link #keyExistsInTable}とは異なり、SQLの実行に失敗した場合はfalseを返さずに例外を投げる。
    DBのエラーを「キーが存在しない」と取り違えないようにするためである。
  en: |-
    Checks whether a record with the specified key exists in the primary key table.

    <p>Unlike {@link #keyExistsInTable}, it throws an exception instead of returning false when executing
    the SQL fails. This is to avoid mistaking a DB error for "the key does not exist".
