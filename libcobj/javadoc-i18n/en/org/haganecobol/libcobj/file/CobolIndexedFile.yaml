- ja: |-
    REWRITE/DELETEで{@link #lockRecord}がfalseを返したときのファイル状態を決める。

    <p>レコードが存在しないことを実際に確認できた場合だけ{@code COB_STATUS_23_KEY_NOT_EXISTS}を返す。
    レコードが存在するのにロックできなかった場合は想定外の状態なので{@code COB_STATUS_30_PERMANENT_ERROR}を返す。
  en: |-
    Determines the file status when {@link #lockRecord} returns false in REWRITE/DELETE.

    <p>Returns {@code COB_STATUS_23_KEY_NOT_EXISTS} only if it is actually confirmed that the record does
    not exist. If the record exists but could not be locked, this is an unexpected state, so
    {@code COB_STATUS_30_PERMANENT_ERROR} is returned.
- ja: |-
    ロックしようとした主キーの値
  en: |-
    the primary key value that was to be locked
- ja: |-
    ファイル状態
  en: |-
    the file status
- ja: |-
    存在チェックのSQLの実行に失敗した場合
  en: |-
    if executing the SQL for the existence check fails
- ja: |-
    SQLの実行時例外をCOBOLのファイルステータスへ変換する。

    <p>参照実装に合わせた対応付けとする。ディスクフルはGnuCOBOLが{@code ENOSPC}に対して返す
    {@code 34}(境界違反)、一意制約違反はopensource COBOL
    1.xが書き込み失敗に対して返す{@code 22}(キーが既に存在)、ロック競合は{@code
    51}(レコードロック)、その他のI/Oエラーは{@code 30}(永続エラー)とする。
  en: |-
    Converts an SQL runtime exception into a COBOL file status.

    <p>The mapping follows the reference implementations: a full disk maps to {@code 34} (boundary
    violation), which GnuCOBOL returns for {@code ENOSPC}; a unique constraint violation maps to
    {@code 22} (key already exists), which opensource COBOL 1.x returns for a write failure; a lock
    conflict maps to {@code 51} (record locked); and any other I/O error maps to {@code 30} (permanent
    error).
- ja: |-
    発生した例外
  en: |-
    the exception that occurred
- ja: |-
    対応するファイルステータス
  en: |-
    the corresponding file status
- ja: |-
    {@code index}番目のキーのテーブルへレコードを挿入するSQL文を返す。
  en: |-
    Returns the SQL statement that inserts a record into the table of the {@code index}-th key.
- ja: |-
    OUTPUTモード（遅延コミット中）のWRITE。トランザクション全体をロールバックすると
    バッファ済みの成功したWRITEまで巻き戻ってしまうため、副キーを持つファイルでは
    セーブポイントでこのWRITEの変更だけを取り消せるようにする（副キーがなければ
    WRITEの変更は単一のINSERTだけで部分的な変更が残る失敗は存在しないため、
    セーブポイント自体を省略する）。コミットは環境変数{@code
    COB_FILE_IDX_COMMIT_INTERVAL}で指定したレコード数の成功したWRITEがたまるごとに行い（{@code
    INF}指定時は行わず）、残りはCLOSE時にまとめてコミットする。
  en: |-
    WRITE in OUTPUT mode (during deferred commit). Since rolling back the whole transaction would also
    undo buffered successful WRITEs, for files with alternate keys a savepoint is used so that only the
    changes of this WRITE can be undone (if there are no alternate keys, a WRITE consists of a single
    INSERT and no failure can leave partial changes, so the savepoint itself is omitted). A commit is
    performed each time the number of successful WRITEs specified by the environment variable
    {@code COB_FILE_IDX_COMMIT_INTERVAL} has accumulated (never when {@code INF} is specified), and the
    rest are committed together at CLOSE.
- ja: |-
    遅延コミット中のWRITEがSQLエラーで失敗したことを記録する。

    <p>SQLiteはディスクフル({@code SQLITE_FULL})やI/Oエラーなどの場合、失敗した文だけでなく
    トランザクション全体を自動的にロールバックすることがある。その場合、直前のコミット以降に
    バッファされていたレコードはすべて失われるが、プログラムから見えるのは当該WRITEの
    エラーだけである。ここで記録しておき、{@link #close_}が成功を返さないようにする。
  en: |-
    Records that a WRITE during deferred commit failed with an SQL error.

    <p>In cases such as a full disk ({@code SQLITE_FULL}) or an I/O error, SQLite may automatically roll
    back the whole transaction, not just the failed statement. In that case all records buffered since
    the last commit are lost, but the program only sees the error of that WRITE. The failure is recorded
    here so that {@link #close_} does not return success.
- ja: |-
    {@code indexed_write_internal}の結果
  en: |-
    the result of {@code indexed_write_internal}
- ja: |-
    引数をそのまま返す
  en: |-
    the argument as is
- ja: |-
    遅延コミット中のWRITEの結果を受け取り、成功したWRITEが{@code
    COB_FILE_IDX_COMMIT_INTERVAL}で指定した件数たまっていればコミットする。

    <p>コミットに失敗した場合は、そのコミットを引き起こしたWRITE文でエラーを報告する。
    順編成ファイルの書き込みバッファも、バッファのフラッシュに失敗するとそれを引き起こした
    WRITE文が{@code 30}を返す({@link CobolSequentialFile})ので、それに倣う。
    トランザクション自体は無傷でレコードは書き込まれたままなので、カウンタを維持して
    次に成功したWRITEかCLOSEでコミットを再試行する。
  en: |-
    Receives the result of a WRITE during deferred commit, and commits if the number of successful
    WRITEs specified by {@code COB_FILE_IDX_COMMIT_INTERVAL} has accumulated.

    <p>If the commit fails, the error is reported on the WRITE statement that triggered the commit. This
    follows the write buffer of sequential files, where the WRITE statement that triggered a failed
    buffer flush returns {@code 30} ({@link CobolSequentialFile}). Since the transaction itself is intact
    and the records remain written, the counter is kept and the commit is retried at the next successful
    WRITE or at CLOSE.
- ja: |-
    直前の{@code indexed_write_internal}の結果
  en: |-
    the result of the preceding {@code indexed_write_internal}
- ja: |-
    WRITEのファイルステータス。途中コミットに失敗した場合はその原因に応じた
        エラーステータス
  en: |-
    the file status of the WRITE; if an intermediate commit fails, an error status depending on its
        cause
- ja: |-
    COBOLの{@code COMMIT}文の処理。接続が有効な限り、遅延中のWRITEの有無や
    オープンモードによらず現在のトランザクションを無条件にコミットし、
    その後{@link #unlock_}でこのプロセスが保持するレコードロックを解放する。
  en: |-
    Processes the COBOL {@code COMMIT} statement. As long as the connection is valid, it
    unconditionally commits the current transaction regardless of whether there are deferred WRITEs or of
    the open mode, and then releases the record locks held by this process with {@link #unlock_}.
- ja: |-
    COBOLの{@code ROLLBACK}文の処理。

    <p>OUTPUTモード(遅延コミット中)では、まだコミットしていないWRITEを実際に取り消す。
    このモードではファイル全体を自プロセスが排他しており、他プロセスが観測できる状態は
    オープン時のコミット時点のままなので、取り消しても整合性は保たれる。取り消し後は
    順序チェックの基準となる直前キーも消し、同じキーから書き直せるようにする。

    <p>それ以外のモードでは、参照実装(opensource COBOL 1.xとGnuCOBOL 3.xのcob_rollback。
    どちらもロック解放しか行わない)と同じくレコードロックの解放だけを行う。これらのモードでは
    各WRITE/REWRITE/DELETEがその場でコミットされており、取り消せる変更が存在しない。
  en: |-
    Processes the COBOL {@code ROLLBACK} statement.

    <p>In OUTPUT mode (during deferred commit), it actually undoes the WRITEs that have not yet been
    committed. In this mode the whole file is held exclusively by this process, and the state observable
    by other processes remains as of the commit at open time, so undoing them preserves consistency.
    After undoing, the previous key used as the basis for the sequence check is also cleared, so that
    writing can resume from the same key.

    <p>In other modes, like the reference implementations (cob_rollback in opensource COBOL 1.x and
    GnuCOBOL 3.x, both of which only release locks), it only releases record locks. In these modes each
    WRITE/REWRITE/DELETE is committed immediately, so there are no changes that can be undone.
- ja: |-
    このプロセスが保持しているレコードロックをすべて解放する。COBOLの{@code UNLOCK}文、
    および{@code COMMIT}/{@code ROLLBACK}文（{@link CobolFile#commit}/{@link
    CobolFile#rollback}）から呼ばれる。

    <p>参照実装(opensource COBOL 1.xのcob_file_unlock)と同様にレコードロックを解放する。
    ただしC版と異なりファイルロック（{@code file_lock}テーブルの行）は解放しない。
    この行はオープン中であることの登録を兼ねており、CLOSE前に消すと他プロセスの{@code OPEN
    OUTPUT}がテーブルを作り直せてしまうためである。

    <p>レコードロックを保持し得るのはI-Oモードだけなので、それ以外のモードでは何もしない
    （遅延コミット中のOUTPUTモードでここでコミットすると、未確定のWRITEまで
    確定させてしまう副作用もあるため、早期returnはその防止も兼ねる）。

    <p>ロック解放を他プロセスから見えるようにするにはコミットが必要だが、これが
    {@code ROLLBACK}文の意味論と衝突することはない。I-Oモードでは各WRITE/REWRITE/DELETEが
    その場でコミットされており未確定のユーザデータが存在しないため、ここでのコミットは
    ロック解放のUPDATEを確定させるだけである。
  en: |-
    Releases all record locks held by this process. Called from the COBOL {@code UNLOCK} statement and
    from the {@code COMMIT}/{@code ROLLBACK} statements ({@link CobolFile#commit}/{@link
    CobolFile#rollback}).

    <p>Like the reference implementation (cob_file_unlock in opensource COBOL 1.x), it releases record
    locks. Unlike the C version, however, it does not release the file lock (the row in the
    {@code file_lock} table). This row also serves as the registration that the file is open, and if it
    were deleted before CLOSE, an {@code OPEN OUTPUT} by another process could recreate the tables.

    <p>Since only I-O mode can hold record locks, it does nothing in other modes (committing here in
    OUTPUT mode during deferred commit would have the side effect of also committing pending WRITEs, so
    the early return also prevents that).

    <p>Making the lock release visible to other processes requires a commit, but this does not conflict
    with the semantics of the {@code ROLLBACK} statement. In I-O mode each WRITE/REWRITE/DELETE is
    committed immediately and there is no pending user data, so the commit here only finalizes the
    UPDATE that releases the locks.
- ja: |-
    現在のJDBCトランザクションを明示的にコミットする。

    <p>{@link #setCommitOnModification(boolean)}{@code
    (false)}と組み合わせて使うことを想定している。文ごとのコミットを抑制した状態で一連の更新を行った後、このメソッドがそれらをまとめて1回のコミットでフラッシュする。
  en: |-
    Explicitly commits the current JDBC transaction.

    <p>It is intended to be used together with {@link #setCommitOnModification(boolean)}{@code (false)}.
    After a series of updates has been performed with per-statement commits suppressed, this method
    flushes them all with a single commit.
