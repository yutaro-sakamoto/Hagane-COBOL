- ja: |-
    各更新文（{@code WRITE}／{@code REWRITE}／{@code DELETE}）がトランザクションを即座にコミットするかどうかを制御する。

    <p>デフォルトは{@code true}。{@code cobj-idx
    load}のような一括ローダは、速度のためにレコードごとのコミットを抑制するため{@code false}に設定し、最後に{@link
    #commitJdbcTransaction()}で一度だけコミットする。

    <p>なお{@code OPEN OUTPUT}されたファイルはこのフラグと無関係に常にコミットを遅延し、{@code
    CLOSE}時に一括コミットする（{@link #writeDeferred}参照）。そのためOUTPUTモードではこのフラグは参照されない。
  en: |-
    Controls whether each update statement ({@code WRITE} / {@code REWRITE} / {@code DELETE}) commits
    the transaction immediately.

    <p>The default is {@code true}. Bulk loaders such as {@code cobj-idx load} set it to {@code false} to
    suppress per-record commits for speed, and commit only once at the end with
    {@link #commitJdbcTransaction()}.

    <p>Note that a file opened with {@code OPEN OUTPUT} always defers commits regardless of this flag and
    commits them all at once at {@code CLOSE} (see {@link #writeDeferred}). Therefore this flag is not
    consulted in OUTPUT mode.
- ja: |-
    更新のたびにコミットする場合は{@code true}、コミットを遅延させる場合は{@code false}
  en: |-
    {@code true} to commit on every update, or {@code false} to defer commits
- ja: |-
    指定したキーと比較条件に一致する最初のレコードにカーソルを位置づける。

    <p>キーフィールドのアドレスを宣言済みのキーと照合してどのキー（したがってどのSQLiteテーブル）を使うかを判定し、そのキー向けに新しい{@link
    IndexedCursor}を生成して、1件のレコードをフェッチする。成功時には現在のキー／レコードバッファ（{@code p.key}／{@code
    p.data}）が更新される。これは{@link #start_(int,
    AbstractCobolField)}とランダムな{@link #read_(AbstractCobolField, int)}の共通実装である。
  en: |-
    Positions the cursor at the first record matching the specified key and comparison condition.

    <p>It determines which key (and therefore which SQLite table) to use by matching the address of the
    key field against the declared keys, creates a new {@link IndexedCursor} for that key, and fetches
    one record. On success, the current key/record buffers ({@code p.key} / {@code p.data}) are updated.
    This is the common implementation of {@link #start_(int, AbstractCobolField)} and a random
    {@link #read_(AbstractCobolField, int)}.
