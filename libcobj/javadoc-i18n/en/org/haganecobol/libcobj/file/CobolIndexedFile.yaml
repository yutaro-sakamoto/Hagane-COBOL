        #COB_LT}、{@link #COB_LE}, {@link #COB_NE}のいずれか。
  en: |-
    the comparison condition (one of {@link #COB_EQ}, {@link #COB_GT}, {@link #COB_GE},
        {@link #COB_LT}, {@link #COB_LE}, {@link #COB_NE})
