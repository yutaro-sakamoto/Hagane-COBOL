- ja: |-
    INDEXEDファイル（{@code ORGANIZATION IS INDEXED}）向けの{@link CobolFile}の具象実装。

    <p>各INDEXEDファイルは1つのSQLiteデータベースをバックエンドとする（1ファイル＝1データベースであり、xerialの{@code
    sqlite-jdbc}ドライバ経由でアクセスする）。主キーは{@code table0}テーブルに、各副キーは{@code
    tableI}に格納される。ファイル全体のロックは{@code file_lock}テーブルで、レコードロックは{@code table0}の{@code
    locked_by}列で管理する。ファイルのメタデータ（レコードサイズとキーのレイアウト）は{@code metadata_*}テーブルに保持する。

    <p>このクラスは{@link CobolFile}の{@code *_}フックメソッド（{@link #open_}、{@link #read_}、{@link
    #write_}、{@link #rewrite_}、{@link #delete_}、{@link
    #start_}など）をオーバーライドし、各COBOLのI/O動詞を対応するSQL操作へ変換する。順次ナビゲーション（{@code READ NEXT}／{@code
    READ PREVIOUS}）は{@link IndexedCursor}でエミュレートする。

    <p>すべてのSQLは明示的なトランザクション内で実行され（{@code setAutoCommit(false)}、{@code
    TRANSACTION_SERIALIZABLE}）、各文は成功時にコミット、失敗時にロールバックする。ただし{@code OPEN
    OUTPUT}されたファイルは例外で、ファイル全体が排他ロックされ他プロセスから読まれることがないため、{@code
    WRITE}ごとのコミットを行わず、環境変数{@code COB_FILE_IDX_COMMIT_INTERVAL}で指定したレコード数の{@code
    WRITE}が成功するごとと、{@code CLOSE}時（{@link #close_}）にコミットする（{@code
    INF}指定時はCLOSE時のみ）。この間の{@code WRITE}失敗はセーブポイントにより当該{@code WRITE}の変更だけを取り消す。
  en: |-
    Concrete implementation of {@link CobolFile} for INDEXED files ({@code ORGANIZATION IS INDEXED}).

    <p>Each INDEXED file is backed by one SQLite database (one file = one database, accessed through the
    xerial {@code sqlite-jdbc} driver). The primary key is stored in the {@code table0} table, and each
    alternate key in {@code tableI}. Whole-file locks are managed with the {@code file_lock} table, and
    record locks with the {@code locked_by} column of {@code table0}. The file's metadata (record size and
    key layout) is kept in the {@code metadata_*} tables.

    <p>This class overrides the {@code *_} hook methods of {@link CobolFile} ({@link #open_},
    {@link #read_}, {@link #write_}, {@link #rewrite_}, {@link #delete_}, {@link #start_}, and so on), and
    translates each COBOL I/O verb into the corresponding SQL operations. Sequential navigation
    ({@code READ NEXT} / {@code READ PREVIOUS}) is emulated with {@link IndexedCursor}.

    <p>All SQL is executed within explicit transactions ({@code setAutoCommit(false)},
    {@code TRANSACTION_SERIALIZABLE}); each statement is committed on success and rolled back on failure.
    The exception is a file opened with {@code OPEN OUTPUT}: since the whole file is exclusively locked
    and never read by other processes, it does not commit on every {@code WRITE}, but instead commits
    each time the number of successful {@code WRITE}s specified by the environment variable
    {@code COB_FILE_IDX_COMMIT_INTERVAL} is reached, and at {@code CLOSE} ({@link #close_}) (only at CLOSE
    when {@code INF} is specified). A {@code WRITE} failure during this period undoes only the changes of
    that {@code WRITE}, using a savepoint.
