- ja: |-
    実行単位(スレッド)ごとに保持する作業状態。<br>
    文の処理は複数のメソッド呼び出しにまたがって状態を共有するため、スレッドごとに独立させる。
  en: |-
    Working state held per run unit (thread).<br>
    Since the processing of a statement shares state across multiple method calls, the state is kept
    independent per thread.
- ja: |-
    現在のスレッドの作業状態。実行単位はスレッドごとに独立しているため、スレッドごとに保持する。
  en: |-
    Working state of the current thread. Since each run unit is independent per thread, it is held per
    thread.
- ja: |-
    現在のスレッドに紐づく作業状態を破棄する。実行単位の終了時に呼び出す。
  en: |-
    Discards the working state bound to the current thread. Called when the run unit terminates.
