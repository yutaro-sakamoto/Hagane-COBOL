# Translations of the Javadoc comments. Generated and updated by
# `./gradlew syncJavadocTranslations` in libcobj/.
# Fill in `en` for each `ja`. Do not edit `ja` by hand:
# it must match the Japanese text in the source file.
- ja: |-
    DISPLAY文やACCEPT文に関するメソッドを実装するクラス
  en: |-
    Class that implements methods related to DISPLAY and ACCEPT statements.
- ja: |-
    DISPLAY UPON COMMAND-LINE文で設定されたコマンドラインデータ。<br>
    実行単位はスレッドごとに独立しているため、スレッドごとに保持する。設定されていない場合はnull。
  en: |-
    The command line data set by a DISPLAY UPON COMMAND-LINE statement.<br>
    Run units are independent per thread, so it is held per thread. null if not set.
- ja: |-
    現在のスレッドに紐づくコマンドラインデータを破棄する。実行単位の終了時に呼び出す。
  en: |-
    Discards the command line data bound to the current thread. Called when the run unit ends.
- ja: |-
    標準出力または標準エラー出力にデータを出力する
  en: |-
    Writes data to standard output or standard error.
- ja: |-
    trueなら標準出力に,それ以外は標準エラー出力に出力する
  en: |-
    if true, output goes to standard output; otherwise, to standard error
- ja: |-
    trueなら出力後に改行しない,それ以外の場合は改行する
  en: |-
    if true, no newline is written after the output; otherwise, a newline is written
- ja: |-
    出力するCOBOL変数(可変長)
  en: |-
    the COBOL variables to output (variable-length)
- ja: |-
    1つのDISPLAY文の出力をストリームへ書き出す。<br>
    複数のスレッドが同じストリームへ出力しても1文分の出力が混ざらないよう、 ストリームのロックを保持したまま書き出す。
  en: |-
    Writes the output of one DISPLAY statement to a stream.<br>
    Writes while holding the lock of the stream so that the output of one statement
    is not interleaved even when multiple threads write to the same stream.
- ja: |-
    出力先
  en: |-
    the output destination
- ja: |-
    trueなら出力後に改行する
  en: |-
    if true, a newline is written after the output
- ja: |-
    出力するCOBOL変数
  en: |-
    the COBOL variables to output
- ja: |-
    0なら標準出力に,それ以外は標準エラー出力に出力する.
  en: |-
    if 0, output goes to standard output; otherwise, to standard error
- ja: |-
    0なら出力後に改行しない,それ以外の場合は改行する
  en: |-
    if 0, no newline is written after the output; otherwise, a newline is written
- ja: |-
    出力するCOBOL変数の数
  en: |-
    the number of COBOL variables to output
- ja: |-
    標準入力を読み込むScannerを取得する(初回呼び出し時に生成する)。
  en: |-
    Returns the Scanner that reads standard input (created on the first call).
- ja: |-
    標準入力を読み込むScanner
  en: |-
    the Scanner that reads standard input
- ja: |-
    標準入力からデータを受け取る
  en: |-
    Receives data from standard input.
- ja: |-
    入力データを格納するCOBOL変数
  en: |-
    the COBOL variable in which the input data is stored
- ja: |-
    COB_DATE環境変数で設定された日時または現在時刻を返す. COB_DATE環境変数で設定された日時({@link
    CobolUtil#cobLocalTm})が存在する場合はその値を返し, 設定されていない場合は現在時刻を返す.

    <p>libcob/common.cのjob_or_current_localtimeに対応する.
  en: |-
    Returns the date and time set by the COB_DATE environment variable, or the current
    time. If the date and time set by the COB_DATE environment variable
    ({@link CobolUtil#cobLocalTm}) exist, returns that value; otherwise, returns the current time.

    <p>Corresponds to job_or_current_localtime in libcob/common.c.
- ja: |-
    COB_DATE環境変数で設定された日時または現在のローカル日時
  en: |-
    the date and time set by the COB_DATE environment variable, or the current local date and time
- ja: |-
    ACCEPT FROM DATE文の実装. 現在の日付を"yyMMdd"形式(2桁年+月+日)でCOBOL変数に格納する.
  en: |-
    Implementation of the ACCEPT FROM DATE statement. Stores the current date
    in the COBOL variable in "yyMMdd" format (2-digit year + month + day).
- ja: |-
    日付データを格納するCOBOL変数
  en: |-
    the COBOL variable in which the date data is stored
- ja: |-
    ACCEPT FROM DATE YYYYMMDD文の実装. 現在の日付を"yyyyMMdd"形式(4桁年+月+日)でCOBOL変数に格納する.
  en: |-
    Implementation of the ACCEPT FROM DATE YYYYMMDD statement. Stores the current
    date in the COBOL variable in "yyyyMMdd" format (4-digit year + month + day).
- ja: |-
    ACCEPT FROM DAY文の実装. 現在の日付を"yyDDD"形式(2桁年+年間通算日)でCOBOL変数に格納する.
  en: |-
    Implementation of the ACCEPT FROM DAY statement. Stores the current date
    in the COBOL variable in "yyDDD" format (2-digit year + day of the year).
- ja: |-
    ACCEPT FROM DAY YYYYDDD文の実装. 現在の日付を"yyyyDDD"形式(4桁年+年間通算日)でCOBOL変数に格納する.
  en: |-
    Implementation of the ACCEPT FROM DAY YYYYDDD statement. Stores the current date
    in the COBOL variable in "yyyyDDD" format (4-digit year + day of the year).
- ja: |-
    ACCEPT FROM DAY-OF-WEEK文の実装. 現在の曜日を1桁の数値(1=月曜日〜7=日曜日)でCOBOL変数に格納する.
  en: |-
    Implementation of the ACCEPT FROM DAY-OF-WEEK statement. Stores the current day
    of the week in the COBOL variable as a 1-digit number (1=Monday to 7=Sunday).
- ja: |-
    曜日データを格納するCOBOL変数
  en: |-
    the COBOL variable in which the day-of-week data is stored
- ja: |-
    ACCEPT FROM TIME文の実装. 現在の時刻を"HHmmssSS"形式(時+分+秒+1/100秒)でCOBOL変数に格納する.

    <p>他の日付系メソッド({@link #acceptDate(AbstractCobolField)}等)とは異なり, {@link
    #jobOrCurrentLocalTime()}を使用せず{@code LocalDateTime.now()}を直接呼び出すため, COB_DATE環境変数の設定は反映されない.
  en: |-
    Implementation of the ACCEPT FROM TIME statement. Stores the current time in
    the COBOL variable in "HHmmssSS" format (hour + minute + second + 1/100 second).

    <p>Unlike the other date methods ({@link #acceptDate(AbstractCobolField)}, etc.),
    this calls {@code LocalDateTime.now()} directly instead of using {@link #jobOrCurrentLocalTime()},
    so the setting of the COB_DATE environment variable is not reflected.
- ja: |-
    時刻データを格納するCOBOL変数
  en: |-
    the COBOL variable in which the time data is stored
- ja: |-
    DISPLAY UPON ENVIRONMENT-NAME文の実装. 後続の{@link #displayEnvValue(AbstractCobolField)}や{@link
    #acceptEnvironment(AbstractCobolField)}で使用する環境変数名を設定する.
  en: |-
    Implementation of the DISPLAY UPON ENVIRONMENT-NAME statement. Sets the environment variable name used by
    subsequent {@link #displayEnvValue(AbstractCobolField)} and {@link #acceptEnvironment(AbstractCobolField)}.
- ja: |-
    環境変数名を保持するCOBOL変数
  en: |-
    the COBOL variable holding the environment variable name
- ja: |-
    DISPLAY UPON ENVIRONMENT-VALUE文の実装. {@link #displayEnvironment(AbstractCobolField)}
    で設定された環境変数名に対して値を設定する. 環境変数名が未設定または空文字列の場合は{@link
    CobolExceptionId#COB_EC_IMP_DISPLAY}例外を設定する.
  en: |-
    Implementation of the DISPLAY UPON ENVIRONMENT-VALUE statement. Sets a value for the environment
    variable name set by {@link #displayEnvironment(AbstractCobolField)}. If the environment variable name
    is not set or is an empty string, sets the {@link CobolExceptionId#COB_EC_IMP_DISPLAY} exception.
- ja: |-
    設定する環境変数の値を保持するCOBOL変数
  en: |-
    the COBOL variable holding the value of the environment variable to set
- ja: |-
    ACCEPT FROM ENVIRONMENT-VALUE文の実装. {@link #displayEnvironment(AbstractCobolField)}
    で設定された環境変数名の値を取得し,COBOL変数に格納する. 環境変数名が未設定の場合や環境変数が存在しない場合は{@link
    CobolExceptionId#COB_EC_IMP_ACCEPT}例外を設定し,スペース1文字を格納する.
  en: |-
    Implementation of the ACCEPT FROM ENVIRONMENT-VALUE statement. Gets the value of the environment
    variable name set by {@link #displayEnvironment(AbstractCobolField)} and stores it in the COBOL
    variable. If the environment variable name is not set or the environment variable does not
    exist, sets the {@link CobolExceptionId#COB_EC_IMP_ACCEPT} exception and stores a single space.
- ja: |-
    環境変数の値を格納するCOBOL変数
  en: |-
    the COBOL variable in which the value of the environment variable is stored
- ja: |-
    DISPLAY UPON COMMAND-LINE文の実装. COBOL変数の内容をコマンドラインデータとして内部バッファに保存する.
    保存されたデータは{@link #acceptCommandLine(AbstractCobolField)}で取得できる.
  en: |-
    Implementation of the DISPLAY UPON COMMAND-LINE statement. Saves the contents
    of the COBOL variable in an internal buffer as command line data. The saved
    data can be obtained with {@link #acceptCommandLine(AbstractCobolField)}.
- ja: |-
    コマンドラインとして設定するデータを保持するCOBOL変数
  en: |-
    the COBOL variable holding the data to set as the command line
- ja: |-
    ACCEPT FROM COMMAND-LINE文の実装. {@link #displayCommandLine(AbstractCobolField)}
    で設定されたコマンドラインデータが存在する場合はそのデータを返し,
    存在しない場合はプログラム起動時のコマンドライン引数をスペース区切りで結合した文字列をCOBOL変数に格納する.
  en: |-
    Implementation of the ACCEPT FROM COMMAND-LINE statement. If command line data set by
    {@link #displayCommandLine(AbstractCobolField)} exists, returns that data; otherwise, stores in the COBOL
    variable a string formed by joining the command line arguments given at program startup with spaces.
- ja: |-
    コマンドラインデータを格納するCOBOL変数
  en: |-
    the COBOL variable in which the command line data is stored
- ja: |-
    DISPLAY UPON ARGUMENT-NUMBER文の実装. COBOL変数の値を現在の引数インデックスとして設定する.
    値が0未満またはコマンドライン引数の数を超える場合は{@link
    CobolExceptionId#COB_EC_IMP_DISPLAY}例外を設定する.
  en: |-
    Implementation of the DISPLAY UPON ARGUMENT-NUMBER statement. Sets the value of the COBOL
    variable as the current argument index. If the value is less than 0 or exceeds the number
    of command line arguments, sets the {@link CobolExceptionId#COB_EC_IMP_DISPLAY} exception.
- ja: |-
    引数インデックス(1始まり)を保持するCOBOL変数
  en: |-
    the COBOL variable holding the argument index (1-based)
- ja: |-
    ACCEPT FROM ARGUMENT-NUMBER文の実装. コマンドライン引数の総数をCOBOL変数に格納する.
  en: |-
    Implementation of the ACCEPT FROM ARGUMENT-NUMBER statement. Stores
    the total number of command line arguments in the COBOL variable.
- ja: |-
    引数の総数を格納するCOBOL変数
  en: |-
    the COBOL variable in which the total number of arguments is stored
- ja: |-
    ACCEPT FROM ARGUMENT-VALUE文の実装. {@link #displayArgNumber(AbstractCobolField)}
    で設定された引数インデックスに対応するコマンドライン引数の値をCOBOL変数に格納し, インデックスを1つ進める.
    インデックスが引数の総数を超えている場合は{@link CobolExceptionId#COB_EC_IMP_ACCEPT}例外を設定する.
  en: |-
    Implementation of the ACCEPT FROM ARGUMENT-VALUE statement. Stores in the COBOL variable
    the value of the command line argument corresponding to the argument index set by
    {@link #displayArgNumber(AbstractCobolField)}, and advances the index by one. If the index exceeds
    the total number of arguments, sets the {@link CobolExceptionId#COB_EC_IMP_ACCEPT} exception.
- ja: |-
    引数の値を格納するCOBOL変数
  en: |-
    the COBOL variable in which the argument value is stored
