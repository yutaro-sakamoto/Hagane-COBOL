# Translations of the Javadoc comments. Generated and updated by
# `./gradlew syncJavadocTranslations` in libcobj/.
# Fill in `en` for each `ja`. Do not edit `ja` by hand:
# it must match the Japanese text in the source file.
- ja: |-
    COBOL の埋め込み SQL 操作（CONNECT、EXEC SQL、カーソル、トランザクション）の DB バックエンドが
    公開すべき全操作を定義するインターフェース。

    <p>{@link CobolEsql} は受け取った呼び出しを、このインターフェースの実装へ渡す。DB ごとの
    差し替えは、実装（{@link CobolEsqlBackendPostgresql} など）を切り替えることで行う。
    接続・文の実行・カーソル・WHERE CURRENT OF・SELECT INTO・prepared statement・トランザクション・
    エラー報告まで、必要な操作はすべてこのインターフェースに並べている。
  en: |-
    Interface defining all operations that a DB backend for COBOL embedded SQL operations (CONNECT,
    EXEC SQL, cursors, transactions) must expose.

    <p>{@link CobolEsql} passes the calls it receives to an implementation of this interface. Switching
    databases is done by switching the implementation (such as {@link CobolEsqlBackendPostgresql}).
    All required operations, from connecting, executing statements, cursors, WHERE CURRENT OF,
    SELECT INTO, prepared statements, and transactions to error reporting, are listed in this interface.
- ja: |-
    実装ごとに決まっている ID（小文字）を返す。例: {@code "postgresql"} / {@code "mysql"}。

    <p>{@link java.util.ServiceLoader} が見つけた実装の中から 1 つを選ぶときに、環境変数
    {@code OCDB_DB_TYPE} の値（小文字化済み）と突き合わせるキー。ログやデバッグ表示にも使う。
  en: |-
    Returns the ID (lowercase) fixed for each implementation, e.g. {@code "postgresql"} / {@code "mysql"}.

    <p>This is the key matched against the value of the environment variable {@code OCDB_DB_TYPE}
    (lowercased) when selecting one of the implementations found by {@link java.util.ServiceLoader}.
    It is also used in logs and debug output.
