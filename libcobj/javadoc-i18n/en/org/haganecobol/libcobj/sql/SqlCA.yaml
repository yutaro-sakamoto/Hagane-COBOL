  en: |-
    Sets the number of rows processed by the preceding SQL statement in SQLERRD(3).
- ja: |-
    処理した行数
  en: |-
    the number of rows processed
- ja: |-
    SQLCA 構造体の SQLERRMC および SQLERRML フィールドをクリアする。
  en: |-
    Clears the SQLERRMC and SQLERRML fields of the SQLCA structure.
- ja: |-
    SQLCA を正常終了に設定するが、SQLERRMC のバイト列は変更しない (SQLERRML は 0 にする)。

    <p>CONNECT 成功時に使う。Open-COBOL-ESQL-4J は CONNECT 成功時に SQLERRMC を
    上書きせず、COBOL が初期化した値 (PIC X のスペース) をそのまま残すため、それに合わせる。
    メッセージ長 SQLERRML は 0 にして「メッセージなし」と整合させる (直前のエラーの長さが
    残らないようにする)。
  en: |-
    Sets the SQLCA to successful completion without changing the SQLERRMC bytes (SQLERRML is set to 0).

    <p>Used when CONNECT succeeds. Open-COBOL-ESQL-4J does not overwrite SQLERRMC when CONNECT succeeds
    and leaves the value initialized by COBOL (PIC X spaces) as is, so this method matches that behavior.
    The message length SQLERRML is set to 0 to be consistent with "no message" (so that the length of a
    previous error does not remain).
- ja: |-
    SQLCA を正常終了を示す状態に設定する (SQLCODE=0, SQLSTATE="00000")。
  en: |-
    Sets the SQLCA to the state indicating successful completion (SQLCODE=0, SQLSTATE="00000").
- ja: |-
    SQLCA を「該当行なし」を示す状態に設定する (SQLCODE=ECPG_NOT_FOUND, SQLSTATE="02000")。
    SELECT INTO やカーソル FETCH で結果が得られなかった場合に使う。
  en: |-
    Sets the SQLCA to the state indicating "no row found" (SQLCODE=ECPG_NOT_FOUND, SQLSTATE="02000").
    Used when SELECT INTO or a cursor FETCH yields no result.
- ja: |-
    SQLCA を ECPG_MISSING_INDICATOR に設定する (sqlcode=-213, sqlstate="22002")。

    <p>「指標変数なしの NULL 値」を通知する。これは、フェッチした列が SQL NULL であり、
    かつホスト変数に対応する指標変数がない場合の ECPG 標準の動作である。COBOL フィールド
    自体には依然として値が書き込まれる (通常はゼロ埋め) ため行は処理済みとみなされる。
    アプリケーション側のコードは FETCH/SELECT の後に SQLCODE/SQLSTATE を確認することが想定されている。
  en: |-
    Sets the SQLCA to ECPG_MISSING_INDICATOR (sqlcode=-213, sqlstate="22002").

    <p>Reports a "NULL value without an indicator variable". This is the standard ECPG behavior when a
    fetched column is SQL NULL and the host variable has no corresponding indicator variable. A value
    is still written to the COBOL field itself (usually zero-filled), so the row is considered processed.
    Application code is expected to check SQLCODE/SQLSTATE after FETCH/SELECT.
- ja: |-
    SQLCA を、指定したコード・状態・メッセージのエラーを示す状態に設定する。
  en: |-
    Sets the SQLCA to the state indicating an error with the given code, state, and message.
