- ja: |-
    処理行数を保持する SQLERRD の 0 始まりインデックス。COBOL では {@code SQLERRD(3)} に対応し、
    直前の SQL 文が処理した行数 (INSERT/UPDATE/DELETE の影響行数、FETCH した行数など) が入る。
  en: |-
    0-based index of the SQLERRD element that holds the processed row count. Corresponds to
    {@code SQLERRD(3)} in COBOL, and holds the number of rows processed by the preceding SQL statement
    (the number of rows affected by INSERT/UPDATE/DELETE, the number of rows fetched, etc.).
