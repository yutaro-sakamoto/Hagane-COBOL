# Translations of the Javadoc comments. Generated and updated by
# `./gradlew syncJavadocTranslations` in libcobj/.
# Fill in `en` for each `ja`. Do not edit `ja` by hand:
# it must match the Japanese text in the source file.
- ja: |-
    COBOL の埋め込み SQL で使用する SQLCA (SQL Communication Area) 構造体を管理する。

    <p>{@code ECPG_*} 定数と {@link #setSuccess}・{@link #setMissingIndicator} は、
    {@link CobolEsqlBackendInterface} 実装（別パッケージで提供されるバックエンドを含む）が利用できる
    公開 API。それ以外のメンバはパッケージ内部用である。
  en: |-
    Manages the SQLCA (SQL Communication Area) structure used by COBOL embedded SQL.

    <p>The {@code ECPG_*} constants, {@link #setSuccess}, and {@link #setMissingIndicator} are public APIs
    available to {@link CobolEsqlBackendInterface} implementations (including backends provided in other
    packages). All other members are for internal use within the package.
