# Translations of the Javadoc comments. Generated and updated by
# `./gradlew syncJavadocTranslations` in libcobj/.
# Fill in `en` for each `ja`. Do not edit `ja` by hand:
# it must match the Japanese text in the source file.
- ja: |-
    COBOL の埋め込み SQL 操作（CONNECT、EXEC SQL、カーソル、トランザクション）のエントリポイント。

    <p>本クラスは呼び出しを受け取るだけで、実際の処理は環境変数 {@code OCDB_DB_TYPE} から選んだ
    {@link CobolEsqlBackendInterface} の実装へ渡す。メソッドの形は変えていないので、生成コード
    （{@code CobolEsql.xxx(...)} という静的呼び出し）はそのままで、DB ごとに実装を入れ替えられる。
  en: |-
    Entry point for COBOL embedded SQL operations (CONNECT, EXEC SQL, cursors, transactions).

    <p>This class only receives calls; the actual processing is passed to the implementation of
    {@link CobolEsqlBackendInterface} selected by the environment variable {@code OCDB_DB_TYPE}. Since
    the method signatures are unchanged, the generated code (static calls of the form
    {@code CobolEsql.xxx(...)}) stays the same while the implementation can be swapped per database.
- ja: |-
    ユーティリティクラスのインスタンス化を防ぐための private コンストラクタ。
  en: |-
    Private constructor to prevent instantiation of this utility class.
- ja: |-
    実行単位(スレッド)ごとの backend（遅延初期化）。<br>
    接続・カーソル・prepared statement は backend のインスタンスが保持しており、
    実行単位はスレッドごとに独立しているため、backend もスレッドごとに生成する。
  en: |-
    Backend for each run unit (thread), lazily initialized.<br>
    Connections, cursors, and prepared statements are held by the backend instance, and since run
    units are independent per thread, a backend is also created per thread.
- ja: |-
    現在のスレッドの backend を遅延初期化して返す。{@code OCDB_DB_TYPE} の解決は
    スレッドごとの初回アクセス時に行う。

    <p>{@code OCDB_DB_TYPE} に対応する実装が無いのは設定の誤りであり、SQL のエラーとして
    報告すると接続失敗などと区別がつかない。解決に失敗した場合は
    {@link CobolEsqlBackendFactory#resolve()} の例外をそのまま伝播させ、実行を打ち切る。
  en: |-
    Lazily initializes and returns the backend of the current thread. {@code OCDB_DB_TYPE} is resolved
    on the first access in each thread.

    <p>The absence of an implementation corresponding to {@code OCDB_DB_TYPE} is a configuration error,
    and reporting it as an SQL error would make it indistinguishable from a connection failure and the
    like. If resolution fails, the exception from {@link CobolEsqlBackendFactory#resolve()} is
    propagated as is, aborting execution.
- ja: |-
    {@code OCDB_DB_TYPE} に対応する実装が無い/生成できない場合
  en: |-
    if no implementation corresponding to {@code OCDB_DB_TYPE} exists or it cannot be instantiated
- ja: |-
    現在のスレッドに紐づくESQLの状態を破棄する。実行単位の終了時に呼び出す。<br>
    DISCONNECTされずに残っている接続は、未確定の更新をロールバックしてクローズされる。
  en: |-
    Discards the ESQL state associated with the current thread. Called when the run unit ends.<br>
    Connections left open without DISCONNECT are closed after rolling back uncommitted updates.
