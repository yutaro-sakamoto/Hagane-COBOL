- ja: |-
    {@link AbstractCobolEsqlBackend#buildJdbcUrl(DbSpec)} の入力。接続文字列 {@code dbname@host:port} の
    パース・環境変数フォールバック・末尾空白除去まで適用済みの、DB 非依存な接続情報。

    <p>生成は {@link AbstractCobolEsqlBackend} の接続共通フロー（buildSpec）だけが行う
    （コンストラクタは package-private）。バックエンド実装は getter で読み取るのみ。
  en: |-
    Input to {@link AbstractCobolEsqlBackend#buildJdbcUrl(DbSpec)}. DB-independent connection
    information to which parsing of the connection string {@code dbname@host:port}, environment
    variable fallbacks, and trailing-space removal have already been applied.

    <p>It is created only by the common connection flow (buildSpec) of {@link AbstractCobolEsqlBackend}
    (the constructor is package-private). Backend implementations only read it through the getters.
- ja: |-
    各フィールドを {@link AbstractCobolEsqlBackend} の buildSpec が設定する空の接続情報を生成する。
  en: |-
