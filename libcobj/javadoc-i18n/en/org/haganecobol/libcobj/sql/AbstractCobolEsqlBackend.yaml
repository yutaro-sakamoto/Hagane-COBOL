- ja: |-
    埋め込み SQL の接続先 DB ごとの実装を行うための抽象クラス。{@link CobolEsqlBackendInterface} の
    うち DB によらない処理を本クラスで実装し、DB ごとに書き分けが要る部分だけを
    {@code protected abstract} フックに切り出している（Template Method）。MySQL など別の DB に
    対応するときは、本クラスを継承してフックを実装する。

    <p>SQLCA 構造体の byte エンコードは DB によらない COBOL 側の取り決めなので {@link SqlCA} の
    static ヘルパを共有し、{@code JDBC が返した SQLException → (ECPG コード, ECPG の SQLSTATE)} の
    変換だけを {@link #mapSqlException(SQLException)} フックとして DB ごとに実装する。

    <p>サブクラスから見える範囲は {@code protected} フック群と、その引数・戻り値に現れる型
    {@link DbSpec}/{@link SqlErrorMapping}（同一パッケージのトップレベルクラス）に限る。
    カーソルについては役割を分けており、本クラスはカーソル名をキーに {@link Cursor}（DECLARE 済みか、
    OPEN 済みか、どのクエリに紐づくか）を保持し、DECLARE/OPEN/FETCH/CLOSE が正しい順序で
    呼ばれたかを判定する。フックへ渡すのはカーソル名・クエリ・解決済みパラメータという素の値だけで、
    {@link Cursor} そのものは渡さない。{@code ResultSet} などの JDBC 資源や、先読みのような DB 固有の
    仕組みはサブクラス側が持つ。
  en: |-
    Abstract base class for implementing embedded SQL support for each target database. The
    DB-independent parts of {@link CobolEsqlBackendInterface} are implemented in this class, and only
    the parts that must differ per database are split out into {@code protected abstract} hooks
    (Template Method). To support another database such as MySQL, extend this class and implement the hooks.

    <p>The byte encoding of the SQLCA structure is a COBOL-side convention independent of the database,
    so the static helpers of {@link SqlCA} are shared, and only the conversion
    {@code SQLException returned by JDBC -> (ECPG code, ECPG SQLSTATE)} is implemented per database as
    the {@link #mapSqlException(SQLException)} hook.

    <p>What subclasses can see is limited to the {@code protected} hooks and the types that appear in
    their parameters and return values, {@link DbSpec}/{@link SqlErrorMapping} (top-level classes in the
    same package). Responsibilities for cursors are divided: this class keeps a {@link Cursor} (whether
    it is declared, whether it is open, and which query it is bound to) keyed by cursor name, and checks
    that DECLARE/OPEN/FETCH/CLOSE are called in the correct order. Only plain values (the cursor name,
    the query, and the resolved parameters) are passed to the hooks; the {@link Cursor} itself is not.
    JDBC resources such as {@code ResultSet} and DB-specific mechanisms such as prefetching are held by
    the subclass.
- ja: |-
