- ja: |-
    ログ出力用に、空白文字（改行、タブ、連続するスペース）を単一のスペースにまとめる。
    サブクラスのフック実装が発行 SQL をログ整形するのにも使えるよう protected にする。
  en: |-
    Collapses whitespace (newlines, tabs, consecutive spaces) into a single space for logging.
    It is protected so that subclass hook implementations can also use it to format issued SQL for logs.
- ja: |-
    整形対象の文字列
  en: |-
    the string to format
- ja: |-
    空白をまとめて前後をトリムした文字列
  en: |-
    the string with whitespace collapsed and leading and trailing whitespace trimmed
- ja: |-
    ログ出力用に末尾空白を除去する。null も安全に扱う (接続パラメータ未指定時のため)。
  en: |-
    Removes trailing spaces for logging. Handles null safely (for when connection parameters are not specified).
- ja: |-
    :name ホスト変数名を構成しうる文字 (COBOL データ名: 英数字・ハイフン、加えてアンダースコア) か。
  en: |-
    Returns whether the character can be part of a :name host variable name (a COBOL data name: alphanumerics and hyphens, plus underscores).
- ja: |-
    1 カーソルぶんの状態。DECLARE 済みか、OPEN 済みか、どのクエリとパラメータに紐づくかを持つ。
    DB によらず同じ判定（未 DECLARE のカーソルを使ったらエラー、OPEN 済みのカーソルを再 DECLARE
    したらエラー、OPEN していないカーソルの CLOSE は成功扱い）を本クラスで行うための内部状態で、
    <strong>サブクラスには渡さない</strong>。バックエンド実装が受け取るのはフックの引数
    （カーソル名・クエリ・パラメータ）だけ。
  en: |-
    State of one cursor: whether it is declared, whether it is open, and which query and parameters it
    is bound to. This is internal state used by this class to perform the same checks regardless of the
    database (using an undeclared cursor is an error, re-DECLARE of an open cursor is an error, and
    CLOSE of a cursor that is not open is treated as success), and it is
    <strong>not passed to subclasses</strong>. Backend implementations receive only the hook arguments
    (cursor name, query, and parameters).
- ja: |-
    DECLARE/OPEN/FETCH/CLOSE 文で使用されるカーソル名。
  en: |-
    The cursor name used in DECLARE/OPEN/FETCH/CLOSE statements.
- ja: |-
    このカーソルに紐づく SQL クエリ。
  en: |-
    The SQL query bound to this cursor.
- ja: |-
    クエリ中のホスト変数パラメータの数。
  en: |-
    The number of host variable parameters in the query.
- ja: |-
    このカーソルが現在オープンされているかどうか。
  en: |-
    Whether this cursor is currently open.
- ja: |-
    DECLARE 時にバインドされたホスト変数パラメータ。
  en: |-
    The host variable parameters bound at DECLARE time.
