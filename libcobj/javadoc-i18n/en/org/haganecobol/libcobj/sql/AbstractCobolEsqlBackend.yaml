- ja: |-
    現在のトランザクションを commit し、以降の SQL が新しいトランザクションで実行される状態にする。
    埋め込み SQL では、COBOL プログラムが {@code COMMIT} / {@code ROLLBACK} を書くまで更新は確定
    しない。つまり COMMIT した直後から次のトランザクションが始まっている必要があり、その状態を
    作るところまでが本フックの責務になる。実現手段は DB の流儀に委ねる。例: PostgreSQL は
    {@code autoCommit(true)} のまま {@code COMMIT} と次の {@code BEGIN} を発行し、
    {@code autoCommit=false} 流儀の DB は {@code c.commit()} だけでよい（次のトランザクションは
    最初の SQL で暗黙に始まる）。

    <p>本フックは「commit してトランザクションを継続する」公開操作（{@link #commit(CobolDataStorage)}）
    のためのもの。「commit して接続を閉じる」経路（{@link #disconnect(CobolDataStorage)}）は
    {@link #commitBeforeClose(Connection)} を通る。
  en: |-
    Commits the current transaction and puts the connection into a state where subsequent SQL runs in a
    new transaction. In embedded SQL, updates are not committed until the COBOL program writes
    {@code COMMIT} / {@code ROLLBACK}. That is, the next transaction must already have begun right
    after COMMIT, and creating that state is the responsibility of this hook. How to achieve it is left
    to the database's conventions. For example, PostgreSQL stays in {@code autoCommit(true)} and issues
    {@code COMMIT} followed by the next {@code BEGIN}, while a database following the
    {@code autoCommit=false} convention only needs {@code c.commit()} (the next transaction begins
    implicitly with the first SQL statement).

    <p>This hook serves the public "commit and continue the transaction" operation
    ({@link #commit(CobolDataStorage)}). The "commit and close the connection" path
    ({@link #disconnect(CobolDataStorage)}) goes through {@link #commitBeforeClose(Connection)}.
- ja: |-
    JDBC 接続
  en: |-
    the JDBC connection
- ja: |-
    接続を閉じる直前の commit。{@link #disconnect(CobolDataStorage)} だけが呼ぶ。

    <p>{@link #commitTransaction(Connection)} と違い、次のトランザクションが始まる状態を作る必要は
    ない。直後に接続を閉じるので、開始しても空のまま破棄されるだけである。明示 {@code BEGIN} 流儀の
    DB は本フックを上書きして {@code BEGIN} を省けば、無駄な往復と紛らわしいログを 1 回減らせる。
    既定は {@link #commitTransaction(Connection)} へ委譲するので、暗黙にトランザクションが始まる DB
    （{@code autoCommit=false} 流儀）は実装しなくてよい。
  en: |-
    Commits right before closing the connection. Called only by {@link #disconnect(CobolDataStorage)}.

    <p>Unlike {@link #commitTransaction(Connection)}, there is no need to put the connection into a
    state where the next transaction has begun. Since the connection is closed immediately afterwards,
    any transaction started would just be discarded empty. A database that uses explicit {@code BEGIN}
    can override this hook to omit the {@code BEGIN}, saving one wasted round trip and a confusing log
    entry. The default delegates to {@link #commitTransaction(Connection)}, so databases where a
    transaction begins implicitly (the {@code autoCommit=false} convention) need not implement it.
- ja: |-
    現在のトランザクションを rollback し、以降の SQL が新しいトランザクションで実行される状態に
    する。{@link #commitTransaction(Connection)} と対になるフックで、担当する範囲も同じ。
    例: PostgreSQL は {@code ROLLBACK} と次の {@code BEGIN} を発行し、{@code autoCommit=false}
    流儀の DB は {@code c.rollback()} だけでよい。
  en: |-
    Rolls back the current transaction and puts the connection into a state where subsequent SQL runs
    in a new transaction. This hook is the counterpart of {@link #commitTransaction(Connection)} and has
    the same scope of responsibility. For example, PostgreSQL issues {@code ROLLBACK} followed by the
    next {@code BEGIN}, while a database following the {@code autoCommit=false} convention only needs
    {@code c.rollback()}.
- ja: |-
    カーソルをオープンする（{@code DECLARE} など、どの SQL を発行するかは DB ごとに実装する）。
    ここでは SQL の発行だけを行い、オープン済みかどうかの記録は本クラス側で更新する。
  en: |-
    Opens the cursor (which SQL is issued, such as {@code DECLARE}, is implemented per database).
    This method only issues SQL; this class updates the record of whether the cursor is open.
