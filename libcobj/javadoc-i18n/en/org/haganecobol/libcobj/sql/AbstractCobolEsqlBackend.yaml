    SQL の発行と、このカーソルに紐づく資源や内部状態（あれば）の解放を行う。
  en: |-
    Closes the cursor (which SQL is issued, such as {@code CLOSE}, is implemented per database).
    Issues the SQL and releases the resources and internal state (if any) bound to this cursor.
- ja: |-
    WHERE CURRENT OF を実行する前に、COBOL プログラムから見た現在行までカーソルを戻す
    （PostgreSQL では、先読みした分だけ {@code FETCH BACKWARD} して先読みバッファを捨てる）。
  en: |-
    Moves the cursor back to the current row as seen by the COBOL program before executing WHERE
    CURRENT OF (in PostgreSQL, issues {@code FETCH BACKWARD} by the number of prefetched rows and
    discards the prefetch buffer).
- ja: |-
    すべてのカーソルがまとめて無効になるタイミングで呼ばれる通知フック。既定では何もしない。

    <p>呼ばれるのは (1) COMMIT/ROLLBACK でトランザクションが終わった直後、(2) DISCONNECT で
    接続を閉じる直前、の 2 とおり。カーソルごとに JDBC の {@code ResultSet}/{@code Statement} を
    自前で持つバックエンドは、本フックでそれらをすべて閉じること。閉じ忘れると COMMIT/ROLLBACK の
    たびに資源が残り続ける。カーソルごとの内部状態（先読みバッファなど）を持つバックエンドも、
    ここで捨てる。どちらも持たないバックエンドは、既定のまま何もしなくてよい。

    <p>カーソルを 1 本ずつ閉じる CLOSE は、このフックを通らない。その場合の解放は
    {@link #closeCursorImpl} 側で行うこと。
  en: |-
    Notification hook called when all cursors become invalid at once. Does nothing by default.

    <p>It is called in two cases: (1) right after a transaction ends with COMMIT/ROLLBACK, and (2) right
    before the connection is closed by DISCONNECT. A backend that holds its own JDBC
    {@code ResultSet}/{@code Statement} per cursor must close all of them in this hook; otherwise,
    resources keep accumulating at every COMMIT/ROLLBACK. A backend that holds per-cursor internal state
    (such as a prefetch buffer) should also discard it here. A backend that holds neither can leave the
    default, which does nothing.

    <p>CLOSE, which closes cursors one at a time, does not go through this hook. In that case, release
    resources in {@link #closeCursorImpl}.
- ja: |-
    JDBC ドライバが投げた {@link SQLException} を、COBOL 側が見る (SQLCODE, SQLSTATE) の組へ
    読み替える。例外オブジェクトごと受け取るため、{@code getSQLState()} に加えて
    {@code getErrorCode()}（DB 固有のエラー番号）も判断材料にできる。

    <p>SQLCODE（整数）と SQLSTATE（文字列）の両方を 1 つのフックで返すのは、DB ごとに異なる値を
    ECPG が定める値へ揃えるため。整数だけ変換して SQLSTATE をドライバの値のまま通すと、SQLSTATE
    で分岐する COBOL プログラムが DB ごとに違う値を見ることになる。
  en: |-
    Maps a {@link SQLException} thrown by the JDBC driver to the (SQLCODE, SQLSTATE) pair seen by the
    COBOL side. Since the whole exception object is received, {@code getErrorCode()} (the DB-specific
    error number) can be used in addition to {@code getSQLState()} to decide.

    <p>Both SQLCODE (an integer) and SQLSTATE (a string) are returned by a single hook so that values
    that differ per database are normalized to the values defined by ECPG. If only the integer were
    converted and SQLSTATE were passed through as reported by the driver, COBOL programs that branch on
    SQLSTATE would see different values per database.
- ja: |-
    JDBC ドライバが投げた SQL 例外
  en: |-
