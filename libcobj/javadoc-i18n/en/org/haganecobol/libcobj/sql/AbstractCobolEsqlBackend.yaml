- ja: |-
    WHERE CURRENT OF の実行前にカーソル位置を補正（{@link #repositionForCurrentOf} フック）し、
    カーソル名を補った完全な SQL を返す。接続なし/カーソル未登録のときは SQLCA にエラーを設定し
    {@code null} を返す。
  en: |-
    Adjusts the cursor position before executing WHERE CURRENT OF (the {@link #repositionForCurrentOf}
    hook) and returns the complete SQL with the cursor name appended. If there is no connection or the
    cursor is not registered, sets an error in the SQLCA and returns {@code null}.
- ja: |-
    1 行目に位置付け済みの {@link ResultSet} から OCCURS 配列へ複数行を書き込み、行数・NULL 処理を
    含めて {@code sqlca} を更新する共通処理（SELECT INTO ... OCCURS とカーソルの複数行 FETCH で共用）。

    <p>呼び出し側は本メソッドの前に最初の {@code rs.next()} と 0 行時の扱い（SELECT INTO は
    {@code NOT_FOUND}、カーソル FETCH の末尾は {@code SUCCESS}）を済ませておく。本メソッドは
    1 行以上ある前提で、{@code occursMax} 件まで各列を OCCURS のストライド {@code occursSize} で
    書き込み、{@code SQLERRD(3)} に取得行数を設定する。
  en: |-
    Common processing that writes multiple rows from a {@link ResultSet} already positioned on the first
    row into an OCCURS array and updates {@code sqlca}, including the row count and NULL handling
    (shared by SELECT INTO ... OCCURS and multi-row cursor FETCH).

    <p>Before calling this method, the caller must perform the first {@code rs.next()} and handle the
    zero-row case ({@code NOT_FOUND} for SELECT INTO, {@code SUCCESS} at the end of a cursor FETCH).
    This method assumes there is at least one row, writes each column with the OCCURS stride
    {@code occursSize} for up to {@code occursMax} rows, and sets the number of fetched rows in
    {@code SQLERRD(3)}.
- ja: |-
