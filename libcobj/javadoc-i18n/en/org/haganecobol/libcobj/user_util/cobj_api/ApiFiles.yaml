# Translations of the Javadoc comments. Generated and updated by
# `./gradlew syncJavadocTranslations` in libcobj/.
# Fill in `en` for each `ja`. Do not edit `ja` by hand:
# it must match the Japanese text in the source file.
- ja: |-
    API連携用のJavaファイルを出力するクラス
  en: |-
    Class that outputs Java files for API integration.
- ja: |-
    入力された値を受け取り、javaCreateメソッドを呼び出す
  en: |-
    Receives the input values and calls the javaCreate method.
- ja: |-
    コマンドラインから入力された文字列
  en: |-
    the strings entered on the command line
- ja: |-
    API連携用のJavaファイルを生成する。<br>
    引数で指定されたJSONファイルを読み込み、そのPROGRAM-IDとPROCEDURE DIVISION USING句の情報から
    {@code <PROGRAM-ID>Controller.java}と{@code <PROGRAM-ID>Record.java}の2つのJavaファイルを出力する。
  en: |-
    Generates Java files for API integration.<br>
    Reads the JSON file specified by the argument, and from its PROGRAM-ID and PROCEDURE DIVISION USING
    information outputs two Java files: {@code <PROGRAM-ID>Controller.java} and
    {@code <PROGRAM-ID>Record.java}.
- ja: |-
    cobjコマンドの{@code -info-json-dir}オプションで生成されたJSONファイルのパス
  en: |-
    the path of the JSON file generated by the {@code -info-json-dir} option of the cobj command
- ja: |-
    {@code <PROGRAM-ID>Controller.java}のコードを記述する。<br>
    Spring BootのRestControllerとして動作するクラスを生成し、GET・POSTリクエストを受け付けて
    COBOLプログラムを呼び出した結果を{@code <PROGRAM-ID>Record}として返す処理を出力する。
  en: |-
    Writes the code of {@code <PROGRAM-ID>Controller.java}.<br>
    Generates a class that works as a Spring Boot RestController, outputting code that accepts GET and
    POST requests, calls the COBOL program, and returns the result as a {@code <PROGRAM-ID>Record}.
- ja: |-
    生成する{@code <PROGRAM-ID>Controller.java}の書き込み先FileWriter
  en: |-
    the FileWriter to which the generated {@code <PROGRAM-ID>Controller.java} is written
- ja: |-
    PROCEDURE DIVISION USING句に記述されている引数の配列
  en: |-
    the array of arguments described in the PROCEDURE DIVISION USING phrase
- ja: |-
    {@code <PROGRAM-ID>Record.java}のコードを記述する。<br>
    Controllerクラスがレスポンスとして返却するJava recordクラスを生成する。
    PROCEDURE DIVISION USING句の各引数をrecordのフィールドとして定義し、HTTPステータスコードを表す
    {@code statuscode}フィールドを先頭に持つ。
  en: |-
    Writes the code of {@code <PROGRAM-ID>Record.java}.<br>
    Generates the Java record class that the Controller class returns as its response.
    Each argument of the PROCEDURE DIVISION USING phrase is defined as a field of the record, and it has a
    {@code statuscode} field representing the HTTP status code at the beginning.
- ja: |-
    生成する{@code <PROGRAM-ID>Record.java}の書き込み先FileWriter
  en: |-
    the FileWriter to which the generated {@code <PROGRAM-ID>Record.java} is written
- ja: |-
    生成されるJavaファイルに記述されるメソッドの引数などをカンマ区切りで出力する。<br>
    {@code isType}と{@code isRecord}の組み合わせにより、出力される文字列の形式が変化する。
    <ul>
      <li>{@code isType=true}の場合: {@code <型> <変数名>}の形式で宣言として出力する</li>
      <li>{@code isRecord=true}の場合: {@code <PROGRAM-ID>Record.<変数名>()}の形式でrecordアクセサ呼び出しとして出力する</li>
      <li>どちらもfalseの場合: {@code <変数名>}のみを出力する</li>
    </ul>
  en: |-
    Outputs the method arguments and similar items written in the generated Java file, separated by
    commas.<br>
    The format of the output string varies with the combination of {@code isType} and {@code isRecord}.
    <ul>
      <li>If {@code isType=true}: outputs them as declarations in the form {@code <type> <variable name>}</li>
      <li>If {@code isRecord=true}: outputs them as record accessor calls in the form {@code <PROGRAM-ID>Record.<variable name>()}</li>
      <li>If both are false: outputs only {@code <variable name>}</li>
    </ul>
- ja: |-
    書き込み先のPrintWriter
  en: |-
    the PrintWriter to write to
- ja: |-
    引数に型を付与して宣言形式で出力する場合は{@code true}
  en: |-
    {@code true} to output the arguments as declarations with their types
- ja: |-
    引数をrecordのアクセサ呼び出しとして出力する場合は{@code true}
  en: |-
    {@code true} to output the arguments as record accessor calls
