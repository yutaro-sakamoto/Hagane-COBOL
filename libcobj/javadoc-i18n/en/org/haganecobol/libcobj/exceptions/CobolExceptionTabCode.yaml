# Translations of the Javadoc comments. Generated and updated by
# `./gradlew syncJavadocTranslations` in libcobj/.
# Fill in `en` for each `ja`. Do not edit `ja` by hand:
# it must match the Japanese text in the source file.
- ja: |-
    CobolExceptionIdで定義された例外IDから、COBOL標準の16進数エラーコードへの変換テーブルを保持するクラス。
    codeテーブルのインデックスはCobolExceptionIdの定数値に対応し、値はCOBOL標準で規定された16進数のエラーコードである。
  en: |-
    Class that holds the conversion table from the exception IDs defined in CobolExceptionId to the
    hexadecimal error codes of standard COBOL.
    The indexes of the code table correspond to the constant values of CobolExceptionId, and the values
    are the hexadecimal error codes defined by standard COBOL.
- ja: |-
    CobolExceptionIdの例外IDをインデックスとし、対応する16進数のCOBOLエラーコードを格納する配列
  en: |-
    Array indexed by the exception IDs of CobolExceptionId, holding the corresponding hexadecimal COBOL
    error codes.
