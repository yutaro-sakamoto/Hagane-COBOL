# Translations of the Javadoc comments. Generated and updated by
# `./gradlew syncJavadocTranslations` in libcobj/.
# Fill in `en` for each `ja`. Do not edit `ja` by hand:
# it must match the Japanese text in the source file.
- ja: |-
    CALL文の結果を保持するための基底クラス<br>
    サブクラスで保持する型に対応するgetメソッドをオーバーライドする。
    対応しない型のgetメソッドを呼び出した場合は{@link CobolResultSetException}がスローされる。
  en: |-
    Base class for holding the result of a CALL statement.<br>
    Subclasses override the get method corresponding to the type they hold.
    Calling a get method for an unsupported type throws {@link CobolResultSetException}.
