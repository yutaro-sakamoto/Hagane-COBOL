# Translations of the Javadoc comments. Generated and updated by
# `./gradlew syncJavadocTranslations` in libcobj/.
# Fill in `en` for each `ja`. Do not edit `ja` by hand:
# it must match the Japanese text in the source file.
- ja: |-
    COBOLの定数値(figurative constant)および実行時に用いる各種定数を保持するクラス<br>
    ZERO・SPACE・HIGH-VALUE・LOW-VALUE・QUOTEなどの形象定数や、それらの全角(ZEN)版、
    各種バッファサイズ、10のべき乗表などをまとめて定義する。
  en: |-
    Holds COBOL figurative constant values and various constants used at run time.<br>
    Defines together the figurative constants such as ZERO, SPACE, HIGH-VALUE, LOW-VALUE, and QUOTE, their
    full-width (ZEN) versions, various buffer sizes, a table of powers of 10, and so on.
- ja: |-
    英数字のALL定数(SPACE・ZEROなどの形象定数)に用いる属性
  en: |-
    Attribute used for alphanumeric ALL constants (figurative constants such as SPACE and ZERO).
- ja: |-
    数字定数1に用いる属性(1桁の数字項目)
  en: |-
    Attribute used for the numeric constant 1 (a 1-digit numeric item).
- ja: |-
    Shift_JISの全角ゼロ「０」のバイト列
  en: |-
    Byte sequence of the Shift_JIS full-width zero character.
- ja: |-
    Shift_JISの全角空白「　」のバイト列
  en: |-
    Byte sequence of the Shift_JIS full-width space character.
- ja: |-
    Shift_JISの全角空白(BLANK)のバイト列
  en: |-
    Byte sequence of the Shift_JIS full-width space (BLANK).
- ja: |-
    Shift_JISの全角引用符「”」のバイト列
  en: |-
    Byte sequence of the Shift_JIS full-width quotation mark.
- ja: |-
    Shift_JISの全角スラッシュ「／」のバイト列
  en: |-
    Byte sequence of the Shift_JIS full-width slash.
- ja: |-
    Shift_JISの全角文字1文字あたりのバイト数
  en: |-
    Number of bytes per full-width character in Shift_JIS.
- ja: |-
    全角ゼロのバイト列({@link #SJZERO}の別名)
  en: |-
    Byte sequence of the full-width zero (alias of {@link #SJZERO}).
- ja: |-
    全角空白のバイト列({@link #SJSPC}の別名)
  en: |-
    Byte sequence of the full-width space (alias of {@link #SJSPC}).
- ja: |-
    全角空白(BLANK)のバイト列({@link #SJBLK}の別名)
  en: |-
    Byte sequence of the full-width space (BLANK) (alias of {@link #SJBLK}).
- ja: |-
    全角引用符のバイト列({@link #SJQUOT}の別名)
  en: |-
    Byte sequence of the full-width quotation mark (alias of {@link #SJQUOT}).
- ja: |-
    全角スラッシュのバイト列({@link #SJSLAS}の別名)
  en: |-
    Byte sequence of the full-width slash (alias of {@link #SJSLAS}).
- ja: |-
    全角文字1文字あたりのバイト数({@link #SJCSIZ}の別名)
  en: |-
    Number of bytes per full-width character (alias of {@link #SJCSIZ}).
