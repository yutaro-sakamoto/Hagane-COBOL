    AbstractCobolField)}.
- ja: |-
    受け取り側フィールドが省略されたことを表すダミー引数
  en: |-
    a dummy argument indicating that the receiving field is omitted
- ja: |-
    UNSTRING文の分解結果を受け取り側へ格納する。受け取り側・文字数フィールドが省略された場合のオーバーロード。<br>
    いずれも整数のダミー引数を受け取って{@link #unstringInto(AbstractCobolField, AbstractCobolField,
    AbstractCobolField)}へ委譲する。
  en: |-
    Stores the result of the UNSTRING statement in the receiving field. Overload for when the receiving field
    and the count field are omitted.<br>
    Receives integer dummy arguments for both and delegates to {@link #unstringInto(AbstractCobolField, AbstractCobolField,
    AbstractCobolField)}.
- ja: |-
    UNSTRING文の分解結果を受け取り側へ格納する。受け取り側・区切り文字格納フィールドが省略された場合のオーバーロード。<br>
    いずれも整数のダミー引数を受け取って{@link #unstringInto(AbstractCobolField, AbstractCobolField,
    AbstractCobolField)}へ委譲する。
  en: |-
    Stores the result of the UNSTRING statement in the receiving field. Overload for when the receiving field
    and the delimiter receiving field are omitted.<br>
    Receives integer dummy arguments for both and delegates to {@link #unstringInto(AbstractCobolField, AbstractCobolField,
    AbstractCobolField)}.
- ja: |-
    UNSTRING文の分解結果を受け取り側へ格納する。受け取り側フィールドが省略された場合のオーバーロード。<br>
    整数のダミー引数を受け取って{@link #unstringInto(AbstractCobolField, AbstractCobolField,
    AbstractCobolField)}へ委譲する。
  en: |-
    Stores the result of the UNSTRING statement in the receiving field. Overload for when the receiving field is
    omitted.<br>
    Receives an integer dummy argument and delegates to {@link #unstringInto(AbstractCobolField, AbstractCobolField,
    AbstractCobolField)}.
- ja: |-
    UNSTRING文の分解結果を1個の受け取り側フィールドへ格納する。<br>
    現在のオフセットから分解対象を走査し、登録された区切り文字のいずれかが見つかればその手前までを、
    見つからなければ残り全体を受け取り側へ転記する。区切り文字が登録されていない場合は受け取り側の桁数分を転記する。<br>
    ALL指定の区切り文字では、連続する同一の区切り文字をまとめて読み飛ばす。<br>
    区切り文字格納フィールドが指定されていれば、一致した区切り文字(なければ数字項目はゼロ、それ以外は空白)を転記する。<br>
    文字数フィールドが指定されていれば、転記した文字数(日本語項目では文字単位に換算)を設定する。<br>
    すでに例外が発生している場合、または読み込み位置が分解対象の範囲外の場合は何も行わない。
  en: |-
    Stores the result of the UNSTRING statement in one receiving field.<br>
    Scans the field to be split from the current offset; if any of the registered delimiters is found, moves the
    part up to just before it to the receiving field, and otherwise moves the entire remainder. If no delimiter is
    registered, moves as many characters as the size of the receiving field.<br>
    For a delimiter specified with ALL, consecutive identical delimiters are skipped together.<br>
    If a delimiter receiving field is specified, moves the matched delimiter to it (if there is none, zero for a
    numeric item and spaces otherwise).<br>
    If a count field is specified, sets it to the number of characters moved (counted in characters for a
    national item).<br>
    Does nothing if an exception has already occurred or if the read position is outside the field to be split.
- ja: |-
    区切り文字を格納する(DELIMITER IN)フィールド。省略時はnull
  en: |-
    the field that stores the delimiter (DELIMITER IN), or null if omitted
- ja: |-
    転記した文字数を格納する(COUNT IN)フィールド。省略時はnull
  en: |-
    the field that stores the number of characters moved (COUNT IN), or null if omitted
- ja: |-
    UNSTRING文のTALLYING IN処理。集計先フィールドが省略された場合のオーバーロード。<br>
    整数のダミー引数を受け取り、何も行わない。
  en: |-
    Handles TALLYING IN of the UNSTRING statement. Overload for when the tally field is omitted.<br>
    Receives an integer dummy argument and does nothing.
- ja: |-
    集計先フィールドが省略されたことを表すダミー引数
  en: |-
    a dummy argument indicating that the tally field is omitted
- ja: |-
    実行が停止された場合
  en: |-
    if execution is stopped
- ja: |-
    UNSTRING文のTALLYING IN処理を行う。<br>
    これまでに分解した部分文字列の個数(unstringCount)を、集計先フィールドへ加算する。
  en: |-
    Handles TALLYING IN of the UNSTRING statement.<br>
    Adds the number of substrings split out so far (unstringCount) to the tally field.
- ja: |-
    分解した部分文字列の個数を加算する(TALLYING IN)フィールド
  en: |-
    the field (TALLYING IN) to which the number of split substrings is added
- ja: |-
    UNSTRING文の処理を終了する。<br>
    分解対象にまだ読み込んでいない部分が残っている場合はオーバーフロー例外を設定する。<br>
    分解対象が日本語項目の場合は最終オフセットをバイト単位から文字単位に戻し、文字位置(WITH POINTER)フィールドが
    指定されていれば、次の文字位置(オフセット+1)を書き戻す。
  en: |-
    Finishes processing of the UNSTRING statement.<br>
    If part of the field to be split has not been read yet, sets an overflow exception.<br>
    If the field to be split is a national item, converts the final offset back from bytes to characters, and if
    a character position (WITH POINTER) field is specified, writes back the next character position (offset + 1).
