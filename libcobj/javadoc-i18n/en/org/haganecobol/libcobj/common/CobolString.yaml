    Receives an integer dummy argument and delegates to {@link #unstringInto(AbstractCobolField, AbstractCobolField,
    AbstractCobolField)}.
- ja: |-
    区切り文字格納フィールドが省略されたことを表すダミー引数
  en: |-
    a dummy argument indicating that the delimiter receiving field is omitted
- ja: |-
    文字数を格納する(COUNT IN)フィールド
  en: |-
    the field that stores the count (COUNT IN)
- ja: |-
    UNSTRING文の分解結果を受け取り側へ格納する。区切り文字格納・文字数の両フィールドが省略された場合のオーバーロード。<br>
    いずれも整数のダミー引数を受け取って{@link #unstringInto(AbstractCobolField, AbstractCobolField,
    AbstractCobolField)}へ委譲する。
  en: |-
    Stores the result of the UNSTRING statement in the receiving field. Overload for when both the delimiter
