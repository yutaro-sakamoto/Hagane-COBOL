# Translations of the Javadoc comments. Generated and updated by
# `./gradlew syncJavadocTranslations` in libcobj/.
# Fill in `en` for each `ja`. Do not edit `ja` by hand:
# it must match the Japanese text in the source file.
- ja: |-
    COBOLの手続き部における1つの段落・節を表す抽象クラス<br>
    各段落・節を1つのCobolControlとして表し、{@link #run()}でその単位を実行する。<br>
    {@link #run()}は実行後に続けて実行すべき次の制御を返すことで、段落の連続実行(フォールスルー)を表現する。<br>
    続けて実行すべき制御が無い場合は{@code null}を返す。<br>
    PERFORM文は{@link #perform(CobolControl[], int)}および{@link #performThrough(CobolControl[], int,
    int)}に変換され、GO TO文は移行先のCobolControlを{@link #run()}の戻り値として返すコードに変換される。
  en: |-
    Abstract class representing a single paragraph or section in the COBOL PROCEDURE DIVISION.<br>
    Each paragraph or section is represented as one CobolControl, and {@link #run()} executes that unit.<br>
    {@link #run()} returns the next control to be executed after it, which
    represents consecutive execution of paragraphs (fall-through).<br>
    If there is no control to execute next, it returns {@code null}.<br>
    PERFORM statements are converted to {@link #perform(CobolControl[], int)} and
    {@link #performThrough(CobolControl[], int, int)}, and GO TO statements are converted
    to code that returns the target CobolControl as the return value of {@link #run()}.
- ja: |-
    制御単位の種別(段落か節か)を表す列挙型
  en: |-
    Enumeration representing the kind of control unit (paragraph or section).
