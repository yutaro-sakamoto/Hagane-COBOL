- ja: |-
    節(section)を表す
  en: |-
    Represents a section.
- ja: |-
    この制御単位を実行する。
  en: |-
    Executes this control unit.
- ja: |-
    続けて実行すべき次の制御。続きがない場合は{@code null}
  en: |-
    the next control to execute, or {@code null} if there is none
- ja: |-
