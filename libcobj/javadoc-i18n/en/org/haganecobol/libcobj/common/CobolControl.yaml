  en: |-
    ID identifying this control unit (sequence number of the paragraph or section); -1 if not set.
- ja: |-
    この制御単位の種別(段落か節か)
  en: |-
    The kind of this control unit (paragraph or section).
- ja: |-
    既定値(ID:-1、種別:段落)で制御単位を生成する。
  en: |-
    Creates a control unit with the default values (ID: -1, kind: paragraph).
- ja: |-
    指定されたIDと種別で制御単位を生成する。
  en: |-
    Creates a control unit with the specified ID and kind.
- ja: |-
    制御単位を識別するID
  en: |-
    the ID identifying the control unit
- ja: |-
    制御単位の種別(段落か節か)
  en: |-
    the kind of the control unit (paragraph or section)
- ja: |-
    PERFORM ... THRU ...文に相当し、begin番目からend番目までの制御単位を順に実行する。<br>
    終端が節の場合は、後続の段落も含めて節の終わりまで実行する。
  en: |-
    Corresponds to a PERFORM ... THRU ... statement; executes
    the control units from index begin to index end in order.<br>
    If the last one is a section, execution continues to the
    end of the section, including the paragraphs that follow.
- ja: |-
    段落・節を格納した制御単位の配列
  en: |-
    the array of control units holding the paragraphs and sections
- ja: |-
    実行を開始する制御単位のインデックス
  en: |-
    the index of the control unit at which to start execution
- ja: |-
    実行を終了する制御単位のインデックス
  en: |-
    the index of the control unit at which to end execution
- ja: |-
    PERFORM文に相当し、指定された単一の段落・節を実行する。
  en: |-
    Corresponds to a PERFORM statement; executes the specified single paragraph or section.
- ja: |-
    実行する制御単位のインデックス
  en: |-
    the index of the control unit to execute
