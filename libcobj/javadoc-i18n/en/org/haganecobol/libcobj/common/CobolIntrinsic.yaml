    指定した開始位置offset(1始まり)と長さlengthに従ってフィールドの内容を切り出し、
    フィールドのサイズとデータを更新する。
  en: |-
    Applies reference modification to a result field.<br>
    Extracts part of the field's contents according to the specified start position offset (1-based) and
    length, and updates the size and data of the field.
- ja: |-
    部分参照を適用するフィールド
  en: |-
