- ja: |-
    COBOLの組み込み関数FUNCTION CURRENT-DATEに対応する。<br>
    現在の日付と時刻を「YYYYMMDDHHMMSSccsHHMM」形式の21文字の文字列として返す。<br>
    ここでccは1/100秒、sHHMMはグリニッジ標準時からのオフセット(符号+時+分)を表す。<br>
    環境変数COB_DATEで固定日付が指定されている場合は、日付部分にその値が反映される。<br>
    時刻とオフセットは常に実行時のシステムクロックから取得する。
  en: |-
    Corresponds to the COBOL intrinsic function FUNCTION CURRENT-DATE.<br>
    Returns the current date and time as a 21-character string in the format "YYYYMMDDHHMMSSccsHHMM".<br>
    Here, cc is hundredths of a second, and sHHMM is the offset from Greenwich Mean Time (sign + hours + minutes).<br>
    If a fixed date is specified with the environment variable COB_DATE, that value is reflected in the date part.<br>
    The time and offset are always taken from the system clock at run time.
- ja: |-
    現在日時を表す文字列フィールド
  en: |-
    a string field representing the current date and time
- ja: |-
    COBOLの組み込み関数FUNCTION CHARに対応する。<br>
    引数の整数値(1始まりの順序位置)に対応する1文字を返す。
  en: |-
