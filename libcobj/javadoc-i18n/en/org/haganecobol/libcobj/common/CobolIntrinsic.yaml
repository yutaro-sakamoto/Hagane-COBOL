  en: |-
    Cumulative number of days before the first day of each month (non-leap year). The index is the month (0 to 12).
- ja: |-
    各月初日までの通日(うるう年)。インデックスは月(0〜12)。
  en: |-
    Cumulative number of days before the first day of each month (leap year). The index is the month (0 to 12).
