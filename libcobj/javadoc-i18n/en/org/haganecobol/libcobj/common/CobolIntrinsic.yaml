    年・月・日のいずれかが有効範囲外の場合は例外を設定し、0を返す。
  en: |-
    Corresponds to the COBOL intrinsic function FUNCTION INTEGER-OF-DATE.<br>
    Converts a date in the format "YYYYMMDD" to an integer date (day count with January 1, 1601 as 1).<br>
    If any of the year, month, or day is outside its valid range, sets an exception and returns 0.
- ja: |-
    「YYYYMMDD」形式の日付を保持するフィールド
  en: |-
    the field holding a date in the format "YYYYMMDD"
- ja: |-
    通日を表す数値フィールド
