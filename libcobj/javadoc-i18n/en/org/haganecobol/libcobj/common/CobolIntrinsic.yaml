# Translations of the Javadoc comments. Generated and updated by
# `./gradlew syncJavadocTranslations` in libcobj/.
# Fill in `en` for each `ja`. Do not edit `ja` by hand:
# it must match the Japanese text in the source file.
- ja: |-
    COBOLの組み込み関数(FUNCTION ...)を実装するクラス。<br>
    GnuCOBOL/opensource COBOLのランタイムライブラリlibcobのintrinsic.cに対応する。<br>
    ABS、MOD、FACTORIAL、SUM、MAX、MIN、NUMVAL、CURRENT-DATE、UPPER-CASE、LOWER-CASEなどの
    各組み込み関数を、{@code funcXxx}という名前の静的メソッドとして提供する。<br>
    各メソッドは計算結果を{@link AbstractCobolField}として返す。
  en: |-
    Implements the COBOL intrinsic functions (FUNCTION ...).<br>
    Corresponds to intrinsic.c in libcob, the runtime library of GnuCOBOL/opensource COBOL.<br>
    Provides intrinsic functions such as ABS, MOD, FACTORIAL, SUM, MAX, MIN, NUMVAL, CURRENT-DATE, UPPER-CASE,
    and LOWER-CASE as static methods named {@code funcXxx}.<br>
    Each method returns its result as an {@link AbstractCobolField}.
- ja: |-
