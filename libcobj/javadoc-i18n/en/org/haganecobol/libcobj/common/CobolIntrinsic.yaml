- ja: |-
    組み込み関数の作業領域を初期化する。<br>
    計算結果フィールドは呼び出しのたびに生成するため、現在のスレッドの作業領域をリセットするのみである。
  en: |-
    Initializes the work area for intrinsic functions.<br>
    Since a result field is created on every call, this only resets the work area of the current thread.
- ja: |-
