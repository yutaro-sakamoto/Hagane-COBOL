- ja: |-
    直近に生成した計算結果フィールド。<br>
    組み込み関数の評価中に使用する作業領域であり、実行単位はスレッドごとに独立しているため、
    スレッドごとに保持する。
  en: |-
    Most recently created result field.<br>
    This is a work area used while evaluating intrinsic functions; since each run unit is independent per thread,
    it is held per thread.
- ja: |-
    FUNCTION RANDOMで使用する擬似乱数生成器(スレッドごとに保持する)。
  en: |-
