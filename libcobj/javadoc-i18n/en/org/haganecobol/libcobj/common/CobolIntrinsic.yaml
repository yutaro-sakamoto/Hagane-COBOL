    the format "DDDDDDDttttt" (7 integer digits for the integer date and 5 fractional digits for the time).<br>
    If the integer date is outside the valid range (1 to 3067671), or the time is outside the valid range
    (1 to 86400), sets an exception and makes the result 0.
- ja: |-
    0時からの経過秒数を保持するフィールド
  en: |-
    the field holding the number of seconds since midnight
- ja: |-
    通日と時刻を結合した数値フィールド
  en: |-
    a numeric field combining the integer date and the time
- ja: |-
