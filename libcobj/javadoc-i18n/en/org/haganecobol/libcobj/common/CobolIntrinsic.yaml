    引数の半角文字(英数字)を全角の日本語文字(各国文字)に変換した結果を返す。
  en: |-
    Corresponds to the COBOL intrinsic function FUNCTION NATIONAL.<br>
    Returns the result of converting the half-width (alphanumeric) characters of the argument to full-width
