    windowing method (base year and window) and returns it.<br>
    The second argument specifies the window (50 if omitted), and the third argument specifies the execution year
    (the system date if omitted).<br>
    If an argument is outside its valid range, sets an exception and returns 0.
- ja: |-
    先頭が「YYDDD」形式の年間通日、第2要素が区間、第3要素が実行年を表す数値フィールドの並び
  en: |-
    the list of numeric fields whose first element is a Julian date in the format "YYDDD", second element is the
    window, and third element is the execution year
- ja: |-
    4桁年の年間通日「YYYYDDD」を保持する数値フィールド
  en: |-
    a numeric field holding the Julian date with a 4-digit year "YYYYDDD"
- ja: |-
    COBOLの組み込み関数FUNCTION EXCEPTION-FILEに対応する。<br>
    直近に発生した入出力例外に関するファイル情報(2桁のファイルステータスと、続くファイル名)を返す。<br>
    入出力例外が発生していない場合はファイルステータス"00"のみを返す。
  en: |-
    Corresponds to the COBOL intrinsic function FUNCTION EXCEPTION-FILE.<br>
    Returns file information about the most recent I/O exception (the 2-digit file status followed by the file
    name).<br>
    If no I/O exception has occurred, returns only the file status "00".
- ja: |-
    ファイルステータスとファイル名を保持する文字列フィールド
  en: |-
    a string field holding the file status and the file name
- ja: |-
    COBOLの組み込み関数FUNCTION EXCEPTION-LOCATIONに対応する。<br>
    直近に発生した例外の発生箇所(プログラムID、節・段落名、行番号)を
    「プログラムID; 段落 OF 節; 行番号」などの形式の文字列として返す。<br>
    例外が発生していない場合は空白1文字を返す。
  en: |-
    Corresponds to the COBOL intrinsic function FUNCTION EXCEPTION-LOCATION.<br>
    Returns the location where the most recent exception occurred (program ID, section and paragraph names, and
    line number) as a string in a format such as "program-ID; paragraph OF section; line-number".<br>
    If no exception has occurred, returns a single space.
- ja: |-
    例外発生箇所を表す文字列フィールド
  en: |-
    a string field representing the location where the exception occurred
- ja: |-
    COBOLの組み込み関数FUNCTION EXCEPTION-STATEMENTに対応する。<br>
    直近に発生した例外を引き起こした文(STATEMENT)の名前を、31桁に左詰めした文字列として返す。<br>
    該当する文が無い場合は空白を返す。
  en: |-
    Corresponds to the COBOL intrinsic function FUNCTION EXCEPTION-STATEMENT.<br>
    Returns the name of the statement (STATEMENT) that caused the most recent exception, as a string
    left-justified in 31 characters.<br>
    If there is no such statement, returns spaces.
- ja: |-
    例外を引き起こした文の名前を表す31桁の文字列フィールド
  en: |-
    a 31-character string field representing the name of the statement that caused the exception
- ja: |-
    例外名が取得できなかった場合に用いる既定の例外名"EXCEPTION-OBJECT"のSJISバイト列。
  en: |-
    SJIS byte sequence of the default exception name "EXCEPTION-OBJECT", used when the exception name cannot be
    obtained.
- ja: |-
    COBOLの組み込み関数FUNCTION EXCEPTION-STATUSに対応する。<br>
    直近に発生した例外の名前を、31桁に左詰めした文字列として返す。<br>
    例外が発生していない場合は空白を返す。
  en: |-
    Corresponds to the COBOL intrinsic function FUNCTION EXCEPTION-STATUS.<br>
    Returns the name of the most recent exception as a string left-justified in 31 characters.<br>
    If no exception has occurred, returns spaces.
- ja: |-
    例外の名前を表す31桁の文字列フィールド
  en: |-
    a 31-character string field representing the name of the exception
- ja: |-
    COBOLの組み込み関数FUNCTION FRACTION-PARTに対応する。<br>
    引数の小数部(整数部を除いた値)を返す。
  en: |-
    Corresponds to the COBOL intrinsic function FUNCTION FRACTION-PART.<br>
    Returns the fractional part of the argument (the value excluding the integer part).
- ja: |-
    小数部を保持する数値フィールド
  en: |-
    a numeric field holding the fractional part
- ja: |-
    COBOLの組み込み関数FUNCTION SECONDS-FROM-FORMATTED-TIMEに対応する。<br>
    時刻書式文字列(時を"hh"、分を"mm"、秒を"ss"で表す)に従ってvalueを解析し、
    その時刻を0時からの経過秒数に変換して返す。<br>
    時・分・秒のいずれかが書式中に現れない場合は例外を設定し、0を返す。
  en: |-
    Corresponds to the COBOL intrinsic function FUNCTION SECONDS-FROM-FORMATTED-TIME.<br>
    Parses value according to a time format string (in which "hh" represents hours, "mm" minutes, and "ss"
    seconds), and returns that time converted to the number of seconds since midnight.<br>
    If any of the hours, minutes, or seconds does not appear in the format, sets an exception and returns 0.
- ja: |-
    時刻の書式を表すフィールド("hh"、"mm"、"ss"を含む)
  en: |-
    a field representing the time format (containing "hh", "mm", and "ss")
- ja: |-
    書式に従った時刻文字列を保持するフィールド
  en: |-
    a field holding a time string that follows the format
- ja: |-
    0時からの経過秒数を保持する数値フィールド
  en: |-
    a numeric field holding the number of seconds since midnight
- ja: |-
    COBOLの組み込み関数FUNCTION SECONDS-PAST-MIDNIGHTに対応する。<br>
    現在時刻の、0時からの経過秒数(時 * 3600 + 分 * 60 + 秒)を返す。
  en: |-
    Corresponds to the COBOL intrinsic function FUNCTION SECONDS-PAST-MIDNIGHT.<br>
    Returns the number of seconds since midnight for the current time (hours * 3600 + minutes * 60 + seconds).
- ja: |-
    COBOLの組み込み関数FUNCTION SIGNに対応する。<br>
    引数の符号に応じて、負の場合は-1、0の場合は0、正の場合は1を返す。
  en: |-
    Corresponds to the COBOL intrinsic function FUNCTION SIGN.<br>
    Returns -1 if the argument is negative, 0 if it is zero, and 1 if it is positive.
- ja: |-
    符号を表す数値フィールド(-1、0、または1)
  en: |-
    a numeric field representing the sign (-1, 0, or 1)
- ja: |-
    COBOLの組み込み関数FUNCTION STORED-CHAR-LENGTHに対応する。<br>
    引数の文字列から末尾の空白を取り除いた、実質的な格納文字数を返す。
  en: |-
    Corresponds to the COBOL intrinsic function FUNCTION STORED-CHAR-LENGTH.<br>
    Returns the effective number of stored characters in the argument string, excluding trailing spaces.
- ja: |-
    対象の文字列フィールド
  en: |-
    the target string field
- ja: |-
    末尾の空白を除いた文字数を保持する数値フィールド
  en: |-
    a numeric field holding the number of characters excluding trailing spaces
- ja: |-
    COBOLの組み込み関数FUNCTION SUBSTITUTEに対応する。<br>
    先頭の引数を対象文字列とし、続く引数を(検索文字列, 置換文字列)の組として、
    対象文字列中に出現する各検索文字列を対応する置換文字列に置き換えた結果を返す。<br>
    大文字・小文字を区別して比較する。
  en: |-
    Corresponds to the COBOL intrinsic function FUNCTION SUBSTITUTE.<br>
    Treats the first argument as the target string and the following arguments as pairs of (search string,
    replacement string), and returns the result of replacing each occurrence of a search string in the target
    string with the corresponding replacement string.<br>
    The comparison is case-sensitive.
- ja: |-
    引数の個数(先頭の対象文字列と、それに続く検索・置換の組)
  en: |-
    the number of arguments (the leading target string followed by the search/replacement pairs)
- ja: |-
    先頭が対象文字列、それ以降が検索文字列と置換文字列を交互に並べたフィールドの並び
  en: |-
    the list of fields whose first element is the target string, followed by search strings and replacement
    strings in alternation
- ja: |-
    置換した結果を保持するフィールド
  en: |-
    a field holding the result of the replacement
- ja: |-
    COBOLの組み込み関数FUNCTION SUBSTITUTE-CASEに対応する。<br>
    先頭の引数を対象文字列とし、続く引数を(検索文字列, 置換文字列)の組として、
    対象文字列中に出現する各検索文字列を対応する置換文字列に置き換えた結果を返す。<br>
    大文字・小文字を区別せずに比較する。
  en: |-
    Corresponds to the COBOL intrinsic function FUNCTION SUBSTITUTE-CASE.<br>
    Treats the first argument as the target string and the following arguments as pairs of (search string,
    replacement string), and returns the result of replacing each occurrence of a search string in the target
    string with the corresponding replacement string.<br>
    The comparison is case-insensitive.
- ja: |-
    COBOLの組み込み関数FUNCTION TRIMに対応する。<br>
    引数の文字列の前後の空白を取り除いた結果を返す。directionにより、取り除く位置を切り替える。<br>
    文字列が空白のみの場合は空白1文字を返す。
  en: |-
    Corresponds to the COBOL intrinsic function FUNCTION TRIM.<br>
    Returns the result of removing leading and trailing spaces from the argument string. direction selects
    where spaces are removed.<br>
    If the string consists only of spaces, returns a single space.
- ja: |-
    空白を取り除く対象の文字列フィールド
  en: |-
    the string field from which spaces are removed
- ja: |-
    取り除く位置の指定。1は先頭の空白のみ、2は末尾の空白のみ、それ以外は前後両方の空白を取り除く
  en: |-
    where to remove spaces: 1 removes only leading spaces, 2 removes only trailing spaces, and any other value
    removes both
- ja: |-
    空白を取り除いた結果を保持するフィールド
  en: |-
    a field holding the result with spaces removed
- ja: |-
    COBOLの組み込み関数FUNCTION LOCALE-DATEに対応するオーバーロード。<br>
    ロケールの指定が省略された呼び出しに対応し、既定のロケールで
    {@link #funcLocaleDate(int, int, AbstractCobolField, AbstractCobolField)}を実行する。
  en: |-
    An overload corresponding to the COBOL intrinsic function FUNCTION LOCALE-DATE.<br>
    Handles calls that omit the locale, and executes
    {@link #funcLocaleDate(int, int, AbstractCobolField, AbstractCobolField)} with the default locale.
- ja: |-
    ロケールフィールドが指定されなかったことを表すダミー引数
  en: |-
    a dummy argument indicating that the locale field was not specified
- ja: |-
    ロケールに従って整形した日付文字列を保持するフィールド
  en: |-
    a field holding the date string formatted according to the locale
- ja: |-
    COBOLの組み込み関数FUNCTION LOCALE-DATEに対応する。<br>
    「YYYYMMDD」形式の日付を、指定されたロケール(省略時は既定のロケール)の書式に従って整形した
    日付文字列に変換して返す。<br>
    日付の各要素が有効範囲外の場合は例外を設定し、"0000000000"を返す。
  en: |-
    Corresponds to the COBOL intrinsic function FUNCTION LOCALE-DATE.<br>
    Converts a date in the format "YYYYMMDD" to a date string formatted according to the specified locale (the
    default locale if omitted) and returns it.<br>
    If any component of the date is outside its valid range, sets an exception and returns "0000000000".
- ja: |-
    「YYYYMMDD」形式の日付を保持するフィールド(数値・文字列いずれも可)
  en: |-
    the field holding a date in the format "YYYYMMDD" (either numeric or string)
- ja: |-
    ロケール名を保持するフィールド。nullの場合は既定のロケールを用いる
  en: |-
    the field holding the locale name; if null, the default locale is used
- ja: |-
    {@link #funcLocaleDate}や{@link #funcLocaleTime}などの引数が不正な場合のエラー処理。<br>
    結果フィールドを10桁の"0"で埋め、引数エラーの例外を設定して返す。
  en: |-
    Error handling for invalid arguments to {@link #funcLocaleDate}, {@link #funcLocaleTime}, and similar methods.<br>
    Fills the result field with ten "0" characters, sets an argument error exception, and returns it.
- ja: |-
    エラー結果を格納するフィールド
  en: |-
    the field in which the error result is stored
- ja: |-
    "0000000000"を保持する結果フィールド
  en: |-
    the result field holding "0000000000"
- ja: |-
    COBOLの組み込み関数FUNCTION LOCALE-TIMEに対応するオーバーロード。<br>
    ロケールの指定が省略された呼び出しに対応し、既定のロケールで
    {@link #funcLocaleTime(int, int, AbstractCobolField, AbstractCobolField)}を実行する。
  en: |-
    An overload corresponding to the COBOL intrinsic function FUNCTION LOCALE-TIME.<br>
    Handles calls that omit the locale, and executes
    {@link #funcLocaleTime(int, int, AbstractCobolField, AbstractCobolField)} with the default locale.
- ja: |-
    「hhmmss」形式の時刻を保持するフィールド
  en: |-
    the field holding a time in the format "hhmmss"
- ja: |-
    ロケールに従って整形した時刻文字列を保持するフィールド
  en: |-
    a field holding the time string formatted according to the locale
- ja: |-
    COBOLの組み込み関数FUNCTION LOCALE-TIMEに対応する。<br>
    「hhmmss」形式の時刻を、指定されたロケール(省略時は既定のロケール)の書式に従って整形した
    時刻文字列に変換して返す。<br>
    時・分・秒のいずれかが有効範囲外の場合は例外を設定し、"0000000000"を返す。
  en: |-
    Corresponds to the COBOL intrinsic function FUNCTION LOCALE-TIME.<br>
    Converts a time in the format "hhmmss" to a time string formatted according to the specified locale (the
    default locale if omitted) and returns it.<br>
    If any of the hours, minutes, or seconds is outside its valid range, sets an exception and returns
    "0000000000".
- ja: |-
    「hhmmss」形式の時刻を保持するフィールド(数値・文字列いずれも可)
  en: |-
    the field holding a time in the format "hhmmss" (either numeric or string)
- ja: |-
    COBOLの組み込み関数FUNCTION LOCALE-TIME-FROM-SECONDSに対応するオーバーロード。<br>
    ロケールの指定が省略された呼び出しに対応し、既定のロケールで処理を実行する。
  en: |-
    An overload corresponding to the COBOL intrinsic function FUNCTION LOCALE-TIME-FROM-SECONDS.<br>
    Handles calls that omit the locale, and performs the processing with the default locale.
- ja: |-
    COBOLの組み込み関数FUNCTION LOCALE-TIME-FROM-SECONDSに対応する。<br>
    0時からの経過秒数を時・分・秒に変換し、指定されたロケール(省略時は既定のロケール)の書式に従って
    整形した時刻文字列に変換して返す。<br>
    引数が数値でない場合は例外を設定し、"0000000000"を返す。
  en: |-
    Corresponds to the COBOL intrinsic function FUNCTION LOCALE-TIME-FROM-SECONDS.<br>
    Converts the number of seconds since midnight to hours, minutes, and seconds, and returns a time string
    formatted according to the specified locale (the default locale if omitted).<br>
    If the argument is not numeric, sets an exception and returns "0000000000".
