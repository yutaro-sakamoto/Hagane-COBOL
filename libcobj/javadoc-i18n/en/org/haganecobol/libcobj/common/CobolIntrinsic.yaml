    引数が有効範囲(1〜3067671)外の場合は例外を設定する。
  en: |-
    Corresponds to the COBOL intrinsic function FUNCTION DAY-OF-INTEGER.<br>
    Returns the date corresponding to the integer date (day count with January 1, 1601 as 1) in the Julian date
    format "YYYYDDD".<br>
    If the argument is outside the valid range (1 to 3067671), sets an exception.
- ja: |-
