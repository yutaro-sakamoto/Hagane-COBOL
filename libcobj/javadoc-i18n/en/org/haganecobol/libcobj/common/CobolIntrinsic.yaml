  en: |-
    Returns the most recent result field of the current thread.
- ja: |-
    直近に生成した計算結果フィールド
  en: |-
    the most recently created result field
- ja: |-
    現在のスレッドの直近の計算結果フィールドを設定する。
  en: |-
    Sets the most recent result field of the current thread.
- ja: |-
    計算結果フィールド
  en: |-
    the result field
- ja: |-
    現在のスレッドに紐づく作業領域を破棄する。実行単位の終了時に呼び出す。
  en: |-
    Discards the work area bound to the current thread. Called when the run unit ends.
- ja: |-
    文字列"00"のSJISバイト列(ファイルステータスの初期値などに使用)。
  en: |-
    SJIS byte sequence of the string "00" (used, for example, as the initial value of a file status).
- ja: |-
    libcob/intrinsicのmake_double_entryの実装。<br>
    double型(COB_TYPE_NUMERIC_DOUBLE)の計算結果フィールドを新たに生成し、
    currField()に設定する。
  en: |-
    Implements make_double_entry in libcob/intrinsic.<br>
    Creates a new result field of type double (COB_TYPE_NUMERIC_DOUBLE)
    and sets it as currField().
- ja: |-
    libcob/intrinsicのmake_field_entryの実装。<br>
    指定したフィールドと同じサイズ・属性を持つ計算結果フィールドを新たに生成し、
    currField()に設定する。
  en: |-
    Implements make_field_entry in libcob/intrinsic.<br>
    Creates a new result field with the same size and attributes as the specified field,
    and sets it as currField().
- ja: |-
    生成するフィールドのサイズと属性の基となるフィールド
  en: |-
