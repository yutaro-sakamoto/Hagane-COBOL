    第2引数で区間(省略時は50)、第3引数で実行年(省略時はシステム日付)を指定できる。<br>
    引数が有効範囲外の場合は例外を設定し、0を返す。
  en: |-
    Corresponds to the COBOL intrinsic function FUNCTION DAY-TO-YYYYDDD.<br>
