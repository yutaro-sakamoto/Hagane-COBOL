- ja: |-
    COBOLの組み込み関数FUNCTION DATE-OF-INTEGERに対応する。<br>
    基準日(1601年1月1日を1とする通日)から、対応する日付を「YYYYMMDD」形式で返す。<br>
    引数が有効範囲(1〜3067671)外の場合は例外を設定し、結果を"00000000"とする。
  en: |-
    Corresponds to the COBOL intrinsic function FUNCTION DATE-OF-INTEGER.<br>
    Returns the date corresponding to the integer date (day count with January 1, 1601 as 1) in the format
    "YYYYMMDD".<br>
    If the argument is outside the valid range (1 to 3067671), sets an exception and makes the result "00000000".
- ja: |-
    通日(整数)を保持するフィールド
  en: |-
    the field holding the integer date
- ja: |-
    日付を表す8桁の数値フィールド
  en: |-
    an 8-digit numeric field representing the date
- ja: |-
