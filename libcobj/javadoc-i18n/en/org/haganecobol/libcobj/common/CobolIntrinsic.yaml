- ja: |-
    母標準偏差を保持する数値フィールド。処理中にエラーが発生した場合はnull
  en: |-
    a numeric field holding the population standard deviation, or null if an error occurs during processing
- ja: |-
    COBOLの組み込み関数FUNCTION PRESENT-VALUEに対応する。<br>
    第1引数を割引率とし、第2引数以降を将来の各期の収支とみなして、それらの現在価値の合計を返す。<br>
    引数が2個未満の場合はエラーメッセージを出力し0を返す。
  en: |-
