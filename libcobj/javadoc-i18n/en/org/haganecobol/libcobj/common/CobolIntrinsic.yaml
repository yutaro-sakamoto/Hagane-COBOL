  en: |-
    Corresponds to the COBOL intrinsic function FUNCTION STANDARD-DEVIATION.<br>
    Returns the population standard deviation (the square root of the population variance) of the numeric values
    given as arguments.<br>
    If there is only one argument, returns 0.
