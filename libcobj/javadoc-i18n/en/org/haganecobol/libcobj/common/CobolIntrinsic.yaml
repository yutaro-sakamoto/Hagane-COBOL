- ja: |-
    比較対象となるフィールドの並び
  en: |-
    the list of fields to compare
- ja: |-
    最小値を持つ要素の順序位置を保持する数値フィールド
  en: |-
    a numeric field holding the ordinal position of the element with the smallest value
- ja: |-
    COBOLの組み込み関数FUNCTION ORD-MAXに対応する。<br>
    引数の並びの中で最大の値を持つ要素の順序位置(1始まり)を返す。<br>
    引数が1個以下の場合は0を返す。
  en: |-
    Corresponds to the COBOL intrinsic function FUNCTION ORD-MAX.<br>
    Returns the ordinal position (1-based) of the element with the largest value in the argument list.<br>
    If there is at most one argument, returns 0.
- ja: |-
    最大値を持つ要素の順序位置を保持する数値フィールド
  en: |-
    a numeric field holding the ordinal position of the element with the largest value
- ja: |-
