- ja: |-
    数値データが正(または符号なし)なら1,負なら-1.数値型でない場合は0
  en: |-
    1 if the numeric data is positive (or unsigned), -1 if negative, 0 if not a numeric type
- ja: |-
    符号の有無にかかわらず,thisの保持する数値データに符号を実際に設定する
  en: |-
    Actually sets the sign to the numeric data held by this, regardless of whether it is signed.
- ja: |-
    正符号を設定するときは0以上の値,負符号を設定するときは負の値
  en: |-
    a value of 0 or more to set a positive sign, a negative value to set a negative sign
- ja: |-
    thisの保持する数値データを8バイトの2進数に変換し,long値として返す
  en: |-
    Converts the numeric data held by this to an 8-byte binary number and returns it as a long value.
- ja: |-
    thisの保持する数値データをlongに変換した値
  en: |-
    the numeric data held by this converted to a long
- ja: |-
    thisの保持する数値データをlong値として返す. 基底クラスでは0を返し,各サブクラスでオーバーライドされる.
  en: |-
    Returns the numeric data held by this as a long value. The base class returns 0, and each
    subclass overrides it.
- ja: |-
    thisの保持する数値データをlongに変換した値.基底クラスでは0
  en: |-
    the numeric data held by this converted to a long, or 0 in the base class
- ja: |-
    半角文字への変換を伴う代入を行う(暫定実装として通常の代入を行う)
  en: |-
    Performs a move involving conversion to half-width characters (as a provisional implementation,
    performs a normal move).
- ja: |-
    EBCDIC形式で符号が重ねられた符号桁から符号を取得し,その桁を対応する数字に戻す
  en: |-
    Gets the sign from a sign digit with an overpunched sign in EBCDIC format and restores the digit
    to the corresponding numeral.
- ja: |-
    符号桁を先頭に持つバイトデータ
  en: |-
    the byte data starting with the sign digit
- ja: |-
    符号が正なら1,負なら-1
  en: |-
    1 if the sign is positive, -1 if negative
- ja: |-
    符号桁の数字に対し,指定された符号をEBCDIC形式で重ねて設定する
  en: |-
    Overpunches the specified sign in EBCDIC format onto the digit of the sign digit.
- ja: |-
    負符号を設定するときは負の値,正符号を設定するときはそれ以外の値
  en: |-
    a negative value to set a negative sign, any other value to set a positive sign
- ja: |-
    バイトデータを,指定した1文字で全体を埋めたデータと,照合順序を考慮して比較する
  en: |-
    Compares byte data with data filled entirely with the specified single character, taking the
    collating sequence into account.
- ja: |-
    比較対象のバイトデータ
  en: |-
    the byte data to compare
- ja: |-
    比較対象の文字(size分だけ繰り返されるとみなす)
  en: |-
    the character to compare with (regarded as repeated for size)
- ja: |-
    比較を行い,s1&lt;cの並びなら負の値,等しければ0,s1&gt;cの並びなら正の値
  en: |-
    the result of the comparison: a negative value if s1&lt;the sequence of c, 0 if equal, a positive
    value if s1&gt;the sequence of c
- ja: |-
    バイトデータの指定範囲が,日本語項目の余白(半角空白または全角空白)のみで構成されているかどうかを判定する
  en: |-
    Determines whether the specified range of byte data consists only of national item padding
    (half-width or full-width spaces).
- ja: |-
    判定を開始するバイトデータの添え字
  en: |-
    the index in the byte data at which the check starts
- ja: |-
    判定対象のバイトデータ
  en: |-
    the byte data to check
- ja: |-
    判定するバイト数
  en: |-
    the number of bytes to check
- ja: |-
    余白(半角空白または全角空白)のみで構成されていれば1,そうでなければ0
  en: |-
    1 if it consists only of padding (half-width or full-width spaces), 0 otherwise
