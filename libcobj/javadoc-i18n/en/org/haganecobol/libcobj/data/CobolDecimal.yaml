- ja: |-
    このオブジェクトの値を設定する
  en: |-
    Sets the value of this object.
- ja: |-
    このオブジェクトに設定する値
  en: |-
    the value to set to this object
- ja: |-
    this.valueの値を0にする
  en: |-
    Sets this.value to 0.
- ja: |-
    このオブジェクトのスケールを設定する
  en: |-
    Sets the scale of this object.
- ja: |-
    このオブジェクトに設定するスケール
  en: |-
    the scale to set to this object
