    倍精度浮動小数点数の値を,スケール9のCobolDecimalの値として設定する
  en: |-
    Sets a double-precision floating-point value as the value of this CobolDecimal with scale 9.
- ja: |-
    設定する倍精度浮動小数点数の値
  en: |-
    the double-precision floating-point value to set
- ja: |-
    このオブジェクトの値を,指定されたCOBOLフィールドの属性(型・桁数・スケール)に合わせて格納する
  en: |-
