    destination data area.
- ja: |-
    コピー先のデータ領域
  en: |-
    the destination data area
- ja: |-
    コピー先の開始インデックス
  en: |-
    the start index in the destination
- ja: |-
    コピー元のデータ領域
  en: |-
    the source data area
- ja: |-
    コピー元の開始インデックス
  en: |-
    the start index in the source
- ja: |-
    コピーするバイト数
  en: |-
    the number of bytes to copy
