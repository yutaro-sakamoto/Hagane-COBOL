    COBOL field.
- ja: |-
    値の格納先となるCOBOLフィールド
  en: |-
    the COBOL field in which the value is stored
- ja: |-
    格納方法を指定するオプションフラグ(丸めや桁あふれ時の動作などを指定する)
  en: |-
    option flags specifying how to store the value (rounding, behavior on overflow, etc.)
- ja: |-
    格納処理の結果を示す例外コード.正常終了の場合は0
  en: |-
    the exception code indicating the result of storing, or 0 on success
- ja: |-
    格納処理の途中で実行停止が発生した場合にスローされる
  en: |-
    thrown if a stop of execution occurs during storing
- ja: |-
    このオブジェクトの値を倍精度浮動小数点数に変換し,指定されたCOBOLフィールドに格納する
  en: |-
    Converts the value of this object to a double-precision floating-point number and stores it in the
    specified COBOL field.
- ja: |-
    格納方法を指定するオプションフラグ
  en: |-
    option flags specifying how to store the value
- ja: |-
    格納処理の結果を示すコード.正常終了の場合は0
  en: |-
    the code indicating the result of storing, or 0 on success
- ja: |-
    このオブジェクトの値を10のn乗倍して小数点位置をずらし,スケールをnだけ増加させる.nが正の場合は乗算,負の場合は除算を行う
  en: |-
    Multiplies the value of this object by 10 to the n-th power to shift the decimal point, and increases
    the scale by n. Multiplies if n is positive and divides if n is negative.
- ja: |-
    小数点をずらす桁数.正の値で値を10倍方向に,負の値で1/10方向にシフトする
  en: |-
    the number of digits to shift the decimal point. A positive value shifts the value toward
    multiplying by 10, and a negative value toward dividing by 10.
- ja: |-
    2つのCobolDecimalのスケールを揃える.スケールの小さい方をシフトして,両者のスケールを大きい方に合わせる
  en: |-
    Aligns the scales of two CobolDecimals. Shifts the one with the smaller scale so that both have
    the larger scale.
- ja: |-
    スケールを揃える対象のCobolDecimalインスタンス
  en: |-
    the CobolDecimal instance whose scale is to be aligned
- ja: |-
    このオブジェクトの値と,指定されたCobolDecimalの値を比較する
  en: |-
    Compares the value of this object with the value of the specified CobolDecimal.
- ja: |-
    比較対象のCobolDecimalインスタンス
  en: |-
    the CobolDecimal instance to compare with
- ja: |-
    このオブジェクトの値が大きい場合は正,等しい場合は0,小さい場合は負の値
  en: |-
    a positive value if the value of this object is greater, 0 if equal, a negative value if less
- ja: |-
    このオブジェクトの値を表示用数字(USAGE DISPLAY)形式に変換し,指定されたCOBOLフィールドに格納する
  en: |-
    Converts the value of this object to display numeric (USAGE DISPLAY) format and stores it in the
    specified COBOL field.
- ja: |-
    格納方法を指定するオプションフラグ(桁あふれ時の動作などを指定する)
  en: |-
    option flags specifying how to store the value (behavior on overflow, etc.)
- ja: |-
    格納処理の結果を示すコード.正常終了の場合は0,桁あふれ発生時は対応する例外コード
  en: |-
    the code indicating the result of storing: 0 on success, or the corresponding exception code
    if an overflow occurs
- ja: |-
    このオブジェクトの値をパック10進数(USAGE COMP-3)形式に変換し,指定されたCOBOLフィールドに格納する
  en: |-
    Converts the value of this object to packed decimal (USAGE COMP-3) format and stores it in the
    specified COBOL field.
- ja: |-
    このオブジェクトの値を2進数(USAGE COMP)形式に変換し,指定されたCOBOLフィールドに格納する
  en: |-
    Converts the value of this object to binary (USAGE COMP) format and stores it in the specified
    COBOL field.
- ja: |-
    格納方法を指定するオプションフラグ(桁あふれ時の動作や切り捨ての有無などを指定する)
  en: |-
    option flags specifying how to store the value (behavior on overflow, whether to truncate, etc.)
- ja: |-
