# Translations of the Javadoc comments. Generated and updated by
# `./gradlew syncJavadocTranslations` in libcobj/.
# Fill in `en` for each `ja`. Do not edit `ja` by hand:
# it must match the Japanese text in the source file.
- ja: |-
    BigDecimalを扱うクラス<br>
    COMPUTE等で計算をするときに使用する
  en: |-
    Handles BigDecimal values.<br>
    Used for calculations in COMPUTE and similar statements.
- ja: |-
    数値が非数(NaN)であることを示すスケール値
  en: |-
    Scale value indicating that the number is not a number (NaN).
- ja: |-
    格納時に四捨五入を行うことを示すオプションフラグ
  en: |-
    Option flag indicating that rounding is performed when storing.
- ja: |-
    桁あふれが発生した場合に格納先の値を変更しないことを示すオプションフラグ
  en: |-
    Option flag indicating that the destination value is left unchanged when an overflow occurs.
- ja: |-
    桁あふれが発生した場合に値を切り捨てて格納することを示すオプションフラグ
  en: |-
    Option flag indicating that the value is truncated when stored if an overflow occurs.
- ja: |-
    2進数フィールドで扱うことのできる最大桁数
  en: |-
    Maximum number of digits that a binary field can handle.
- ja: |-
    計算用に使用する作業用のCobolDecimalインスタンス。<br>
    DIVIDE文のREMAINDER句のために、divQuotientからdivRemainderまで剰余を保持する。
    実行単位はスレッドごとに独立しているため、スレッドごとに保持する。
  en: |-
    Work CobolDecimal instance used for calculations.<br>
    Holds the remainder from divQuotient until divRemainder for the REMAINDER phrase of the DIVIDE
    statement. Since run units are independent per thread, it is held per thread.
- ja: |-
    10のべき乗の値をあらかじめ計算して保持する配列(変更不可)
  en: |-
    Array holding precomputed powers of 10 (immutable).
- ja: |-
    パック10進数の比較に使用する作業用バッファ(スレッドごとに保持する)
  en: |-
    Work buffer used for comparing packed decimals (held per thread).
- ja: |-
    パック10進数の値を保持する作業用バッファ
  en: |-
    Work buffer holding a packed decimal value.
- ja: |-
    packedValueに展開済みの整数値
  en: |-
    Integer value already expanded into packedValue.
- ja: |-
    現在のスレッドのパック10進数比較用バッファを取得する
  en: |-
    Returns the packed decimal comparison buffer of the current thread.
- ja: |-
    作業用バッファ
  en: |-
    the work buffer
- ja: |-
    現在のスレッドの剰余保持用のCobolDecimalを取得する
  en: |-
    Returns the CobolDecimal used to hold the remainder for the current thread.
- ja: |-
    剰余保持用のCobolDecimal
  en: |-
    the CobolDecimal used to hold the remainder
- ja: |-
    数値演算で使用するスレッドごとの作業領域を初期化する。<br>
    10のべき乗テーブルはクラス初期化時に構築済みのため、ここでは作業領域のリセットのみを行う。
  en: |-
    Initializes the per-thread work area used in numeric operations.<br>
    Since the table of powers of 10 is built at class initialization, this only resets the work area.
- ja: |-
    現在のスレッドに紐づく作業領域を破棄する。実行単位の終了時に呼び出す。
  en: |-
    Discards the work area bound to the current thread. Called at the end of a run unit.
- ja: |-
    保持する数値データ
  en: |-
    The numeric data held.
- ja: |-
    保持する数値の小数点以下の桁数(スケール)
  en: |-
    The number of decimal places (scale) of the number held.
- ja: |-
    値とスケールは0に設定する
  en: |-
    Sets both the value and the scale to 0.
- ja: |-
    値はvalueを指定し,スケールは0に設定する
  en: |-
    Sets the value to value and the scale to 0.
- ja: |-
    設定する値
  en: |-
    the value to set
- ja: |-
    値とスケールを指定する
  en: |-
    Specifies the value and the scale.
- ja: |-
    設定するスケール
  en: |-
    the scale to set
- ja: |-
    値を指定し,スケールは0に設定する
  en: |-
