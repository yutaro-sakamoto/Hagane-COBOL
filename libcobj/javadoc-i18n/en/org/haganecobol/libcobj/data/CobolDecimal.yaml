    設定元のCOBOLフィールド
  en: |-
    the COBOL field to copy from
- ja: |-
    2つのCobolDecimalのいずれかが非数(NaN)であるかを判定する.いずれかが非数の場合はd1のスケールを非数に設定する
  en: |-
    Determines whether either of two CobolDecimals is not a number (NaN). If either is NaN, sets the
    scale of d1 to NaN.
- ja: |-
    判定対象のCobolDecimalインスタンス(演算結果の格納先)
  en: |-
    the CobolDecimal instance to check (where the result of the operation is stored)
- ja: |-
    判定対象のCobolDecimalインスタンス
  en: |-
    the CobolDecimal instance to check
- ja: |-
    いずれかが非数の場合はtrue,そうでない場合はfalse
  en: |-
    true if either is NaN, false otherwise
- ja: |-
    このオブジェクトの示す数値に対して加算を行う
  en: |-
    Adds to the number represented by this object.
