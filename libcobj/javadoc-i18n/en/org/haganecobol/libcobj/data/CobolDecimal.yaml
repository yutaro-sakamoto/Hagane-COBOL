    このオブジェクトの示す数値に乗算する値
  en: |-
    the value by which to multiply the number represented by this object
- ja: |-
    このオブジェクトの示す数値に対して除算を行う
  en: |-
    Divides the number represented by this object.
- ja: |-
    このオブジェクトの示す数値を除算する値
  en: |-
    the value by which to divide the number represented by this object
- ja: |-
    0除算が検出され,かつ実行時エラーで終了する設定の場合にスローされる
  en: |-
    thrown if division by zero is detected and the setting is to terminate with a runtime error
- ja: |-
    このオブジェクトの示す数値に対して累乗を行う
  en: |-
    Raises the number represented by this object to a power.
- ja: |-
    このオブジェクトの示す数値を累乗する値
  en: |-
