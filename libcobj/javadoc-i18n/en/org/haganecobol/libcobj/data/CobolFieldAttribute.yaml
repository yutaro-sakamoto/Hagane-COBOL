# Translations of the Javadoc comments. Generated and updated by
# `./gradlew syncJavadocTranslations` in libcobj/.
# Fill in `en` for each `ja`. Do not edit `ja` by hand:
# it must match the Japanese text in the source file.
- ja: |-
    COBOL変数の属性情報を保持するクラス.<br>
    変数の種別(数値・英数字・日本語など)・桁数・スケール・各種フラグ・PICTURE句の文字列を保持する.
    種別とフラグは{@code COB_TYPE_*}・{@code COB_FLAG_*}定数で表現される.
  en: |-
    Class that holds the attributes of a COBOL variable.<br>
    Holds the variable type (numeric, alphanumeric, national, etc.), the number of digits, the scale,
    various flags, and the PICTURE clause string.
    Types and flags are represented by the {@code COB_TYPE_*} and {@code COB_FLAG_*} constants.
