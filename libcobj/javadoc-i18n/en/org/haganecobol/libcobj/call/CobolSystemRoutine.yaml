  en: |-
    not implemented
- ja: |-
    組み込み関数CBL_ERROR_PROCの実装。未実装。
  en: |-
    Implementation of the built-in routine CBL_ERROR_PROC. Not implemented.
- ja: |-
    組み込み関数SYSTEMの実装。cmdに指定されたコマンドを実行する。
  en: |-
    Implementation of the built-in routine SYSTEM. Executes the command specified by cmd.
- ja: |-
    コマンド文字列。Linux/Unix環境であればシェルコマンド、Windows環境であればコマンドプロンプトのコマンド。
