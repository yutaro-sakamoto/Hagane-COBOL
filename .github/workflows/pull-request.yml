name: test on pull request

on:
  pull_request:
    types: [opened, reopened, synchronize]
    paths-ignore:
      - "*.md"
      - "ChangeLog"
      - "NEWS"
      - "README"
      - "COPYING"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check-workflows:
    uses: ./.github/workflows/check-workflows.yml

  unit-test:
    needs: check-workflows
    uses: ./.github/workflows/unit-test.yml

  website:
    needs: check-workflows
    uses: ./.github/workflows/website.yml

  # Builds and runs the Linux tests with ./local-ci. Each job builds one
  # compiler (Shift_JIS or UTF-8) and runs a third of its tests.
  local-ci:
    needs: check-workflows
    strategy:
      fail-fast: false
      matrix:
        os: ["ubuntu:26.04", "almalinux:9"]
        charset: ["sjis", "utf8"]
        shard: ["1/3", "2/3", "3/3"]
    uses: ./.github/workflows/local-ci.yml
    with:
      os: ${{ matrix.os }}
      charset: ${{ matrix.charset }}
      shard: ${{ matrix.shard }}

  javadoc:
    needs: check-workflows
    uses: ./.github/workflows/javadoc.yml

  check-missing-javadoc:
    needs: check-workflows
    uses: ./.github/workflows/check-missing-javadoc.yml

  windows-build:
    needs: check-workflows
    uses: ./.github/workflows/windows-build.yml
    with:
      upload-artifacts: true

  windows-test:
    needs: windows-build
    strategy:
      matrix:
        test_name: ["IC", "IF", "IX", "NC", "OB", "RL", "SG", "SM", "SQ", "ST"]
    uses: ./.github/workflows/windows-test.yml
    with:
      test-name: ${{ matrix.test_name }}

  windows-generate-test-scripts:
    needs: check-workflows
    uses: ./.github/workflows/windows-generate-test-scripts.yml

  windows-test-other:
    needs: [windows-build, windows-generate-test-scripts]
    strategy:
      fail-fast: false
      matrix:
        test_name:
          - "command-line-options"
          - "data-rep"
          - "jp-compat"
          - "run"
          - "syntax"
          - "file-lock"
          - "file-lock2"
          - "file-lock3"
          - "file-lock4"
          - "file-lock5"
          - "misc"
          - "multithread"
    uses: ./.github/workflows/windows-test-other.yml
    with:
      test-name: ${{ matrix.test_name }}

  # esql-utf8 is missing on purpose: it needs a compiler configured with
  # --enable-utf8, and the Windows build is Shift_JIS only.
  windows-test-esql:
    needs: [windows-build, windows-generate-test-scripts]
    strategy:
      fail-fast: false
      matrix:
        test_name:
          - "esql-basic"
          - "esql-sqlca"
          - "esql-cobol-data"
          - "esql-misc"
          - "esql-sql-data"
          - "esql-multithread"
    uses: ./.github/workflows/windows-test-esql.yml
    with:
      test-name: ${{ matrix.test_name }}

  static-analysis:
    needs: check-workflows
    uses: ./.github/workflows/static-analysis.yml

  check-dev-container:
    needs: check-workflows
    uses: ./.github/workflows/check-dev-container.yml

  docker-image:
    needs: check-workflows
    # The push job of docker-image.yml requests packages: write, and GitHub
    # checks the permissions of every job of a called workflow up front, even
    # of jobs that are skipped. Pull requests never push (push-image defaults
    # to false).
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/docker-image.yml
