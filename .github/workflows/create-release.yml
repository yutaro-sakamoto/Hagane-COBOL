name: Create a Release

on:
  push:
    tags:
      - v*.*.*

jobs:
  check-workflows:
    uses: ./.github/workflows/check-workflows.yml

  build-artifacts:
    needs: check-workflows
    uses: ./.github/workflows/windows-build.yml
    with:
      upload-artifacts: true

  # Push the Docker image only after the GitHub release has been created, so an
  # image is never published for a release that failed to materialize.
  docker-image:
    needs: create-release
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/docker-image.yml
    with:
      push-image: true
      release-tag: ${{ github.ref_name }}

  create-release:
    needs: build-artifacts
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    steps:
    - uses: actions/checkout@v7

    - name: Create a Release
      run: gh release create ${{ github.ref }} -F ReleaseNote.md

    - name: Download cobj.exe
      uses: actions/download-artifact@v8
      with:
        name: cobj.exe

    - name: Download libcobj.jar
      uses: actions/download-artifact@v8
      with:
        name: libcobj.jar

    - name: Download libcobj-sbom.json
      uses: actions/download-artifact@v8
      with:
        name: libcobj-sbom.json

    - name: Download libcobj-sbom.xml
      uses: actions/download-artifact@v8
      with:
        name: libcobj-sbom.xml

    - name: Publish artifacts
      run: |
        gh release upload ${{ github.ref_name }} cobj.exe --clobber
        gh release upload ${{ github.ref_name }} libcobj.jar --clobber
        gh release upload ${{ github.ref_name }} libcobj-sbom.json --clobber
        gh release upload ${{ github.ref_name }} libcobj-sbom.xml --clobber
        gh release upload ${{ github.ref_name }} config/default.conf --clobber

  # Publish libcobj to Maven Central as org.haganecobol:libcobj.
  # A release on Maven Central cannot be deleted or overwritten, so this runs
  # only after the GitHub release has been created, like the Docker image.
  # See the comment on mavenPublishing in libcobj/app/build.gradle.kts.
  publish-maven-central:
    needs: create-release
    runs-on: ubuntu-latest
    permissions:
      contents: read
    defaults:
      run:
        working-directory: libcobj
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          java-version: '21'
          distribution: 'temurin'
      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@v6
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: wrapper
      # Maven Central rejects a version that has already been published, and a
      # mismatch would publish libcobj under a wrong version. Fail early instead.
      - name: Check that the version of libcobj matches the tag
        env:
          TAG: ${{ github.ref_name }}
        run: |
          version="${TAG#v}"
          if ! grep -qx "val libcobjVersion = \"${version}\"" app/build.gradle.kts; then
            echo "::error::libcobjVersion in libcobj/app/build.gradle.kts is not ${version} (tag ${TAG})"
            exit 1
          fi
      - name: Publish to Maven Central
        # The upload to the Central Portal does not support the configuration cache.
        run: ./gradlew :app:publishAndReleaseToMavenCentral --no-configuration-cache
        env:
          ORG_GRADLE_PROJECT_mavenCentralUsername: ${{ secrets.MAVEN_CENTRAL_TOKEN_USERNAME }}
          ORG_GRADLE_PROJECT_mavenCentralPassword: ${{ secrets.MAVEN_CENTRAL_TOKEN_PASSWORD }}
          ORG_GRADLE_PROJECT_signingInMemoryKey: ${{ secrets.MAVEN_GPG_PRIVATE_KEY }}
          ORG_GRADLE_PROJECT_signingInMemoryKeyPassword: ${{ secrets.MAVEN_GPG_PASSPHRASE }}

  # publish libcobj.jar to GitHub Packages
  publish:
    needs: check-workflows
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
      - run: |
          repo_dir="$(basename "$GITHUB_WORKSPACE")"
          cd ../
          mv "$repo_dir"/* .
          mv libcobj/* "$repo_dir"
      - uses: actions/setup-java@v6
        with:
          java-version: '21'
          distribution: 'temurin'
      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@v6
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: wrapper
      # Only to GitHub Packages. Maven Central is the job publish-maven-central.
      - name: Publish package
        run: ./gradlew publishAllPublicationsToGitHubPackagesRepository
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
