name: Tests of the test runners

# Tests local-ci and win/run-tests.sh themselves (ci-tests/). A bug in a test
# runner can hide failing tests, so the runners are tested on their own:
# with fake tasks and suites, in seconds, without building anything.
# win/run-tests.sh is tested on Linux and in Git Bash on Windows, where the
# Windows CI runs it.

on:
  workflow_call:

permissions:
  contents: read

jobs:
  linux:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout Hagane COBOL
        uses: actions/checkout@v7

      - name: Run shellcheck
        run: shellcheck --severity=error local-ci win/run-tests.sh ci-tests/*.sh

      - name: Test local-ci
        run: ci-tests/local-ci.test.sh

      - name: Test win/run-tests.sh
        run: ci-tests/run-tests.test.sh

  windows:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - name: Checkout Hagane COBOL
        uses: actions/checkout@v7

      - name: Test win/run-tests.sh
        shell: bash
        run: ci-tests/run-tests.test.sh
