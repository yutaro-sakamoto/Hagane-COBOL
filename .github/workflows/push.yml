name: test on push

on:
  push:
    paths-ignore:
      - '*.md'
      - 'ChangeLog'
      - 'NEWS'
      - 'README'
      - 'COPYING'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check-workflows:
    uses: ./.github/workflows/check-workflows.yml

  unit-test:
    needs: check-workflows
    uses: ./.github/workflows/unit-test.yml

  # Tests of local-ci and win/run-tests.sh, which run the tests below
  test-runners:
    needs: check-workflows
    uses: ./.github/workflows/test-runners.yml

  website:
    needs: check-workflows
    uses: ./.github/workflows/website.yml
    with:
      upload-pages-artifact: ${{ github.repository == 'yutaro-sakamoto/Hagane-COBOL' && github.ref == 'refs/heads/main' }}

  # Publish the website to GitHub Pages whenever main is updated. A newer
  # push to main cancels this whole run (see the workflow-level concurrency),
  # including a deploy in progress; the newer run then deploys newer content.
  deploy-website:
    if: github.repository == 'yutaro-sakamoto/Hagane-COBOL' && github.ref == 'refs/heads/main'
    needs: website
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    concurrency:
      group: pages
      cancel-in-progress: false
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5

  # Builds and runs the Linux tests with ./local-ci. Each job builds one
  # compiler (Shift_JIS or UTF-8) and runs half of its tests.
  local-ci:
    needs: check-workflows
    strategy:
      fail-fast: false
      matrix:
        os: ["ubuntu:26.04"]
        charset: ["sjis", "utf8"]
        shard: ["1/2", "2/2"]
    uses: ./.github/workflows/local-ci.yml
    with:
      os: ${{ matrix.os }}
      charset: ${{ matrix.charset }}
      shard: ${{ matrix.shard }}

  coverage:
    needs: check-workflows
    if: github.ref == 'refs/heads/develop'
    uses: ./.github/workflows/coverage.yml

  javadoc:
    needs: check-workflows
    uses: ./.github/workflows/javadoc.yml

  check-missing-javadoc:
    needs: check-workflows
    uses: ./.github/workflows/check-missing-javadoc.yml

  windows-build:
    needs: check-workflows
    uses: ./.github/workflows/windows-build.yml
    with:
      upload-artifacts: true

  windows-generate-test-scripts:
    needs: check-workflows
    uses: ./.github/workflows/windows-generate-test-scripts.yml

  # Each group runs in one job with win/run-tests.sh, two items at a time.
  # The groups take about the same time; within a group the long items come
  # first. The ESQL suites share one database, so they run one after another
  # (joined with +). esql-utf8 is missing on purpose: it needs a compiler
  # configured with --enable-utf8, and the Windows build is Shift_JIS only.
  windows-test:
    needs: [windows-build, windows-generate-test-scripts]
    strategy:
      fail-fast: false
      matrix:
        include:
          - group: other-1
            tests: "run misc file-lock3 command-line-options data-rep multithread syntax"
          - group: other-2
            tests: "file-lock file-lock5 file-lock4 jp-compat file-lock2"
          # Same order as the old Linux ESQL job, which also shared one database
          - group: nist-esql
            tests: "esql-basic+esql-sqlca+esql-cobol-data+esql-misc+esql-sql-data+esql-multithread nist:NC nist:SQ nist:IX nist:IF nist:ST nist:RL nist:IC nist:SM nist:SG nist:OB"
    name: windows-test (${{ matrix.group }})
    uses: ./.github/workflows/windows-test.yml
    with:
      group: ${{ matrix.group }}
      tests: ${{ matrix.tests }}

  static-analysis:
    needs: check-workflows
    uses: ./.github/workflows/static-analysis.yml

  check-dev-container:
    needs: check-workflows
    uses: ./.github/workflows/check-dev-container.yml
