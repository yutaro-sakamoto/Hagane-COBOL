name: test on push

on:
  push:
    paths-ignore:
      - '*.md'
      - 'ChangeLog'
      - 'NEWS'
      - 'README'
      - 'COPYING'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check-workflows:
    uses: ./.github/workflows/check-workflows.yml

  unit-test:
    needs: check-workflows
    uses: ./.github/workflows/unit-test.yml

  website:
    needs: check-workflows
    uses: ./.github/workflows/website.yml
    with:
      upload-pages-artifact: ${{ github.repository == 'yutaro-sakamoto/Hagane-COBOL' && github.ref == 'refs/heads/main' }}

  # Publish the website to GitHub Pages whenever main is updated. A newer
  # push to main cancels this whole run (see the workflow-level concurrency),
  # including a deploy in progress; the newer run then deploys newer content.
  deploy-website:
    if: github.repository == 'yutaro-sakamoto/Hagane-COBOL' && github.ref == 'refs/heads/main'
    needs: website
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    concurrency:
      group: pages
      cancel-in-progress: false
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5

  # Builds and runs the Linux tests with ./local-ci. Each job builds one
  # compiler (Shift_JIS or UTF-8) and runs a third of its tests.
  local-ci:
    needs: check-workflows
    strategy:
      fail-fast: false
      matrix:
        os: ["ubuntu:26.04"]
        charset: ["sjis", "utf8"]
        shard: ["1/3", "2/3", "3/3"]
    uses: ./.github/workflows/local-ci.yml
    with:
      os: ${{ matrix.os }}
      charset: ${{ matrix.charset }}
      shard: ${{ matrix.shard }}

  coverage:
    needs: check-workflows
    if: github.ref == 'refs/heads/develop'
    uses: ./.github/workflows/coverage.yml

  javadoc:
    needs: check-workflows
    uses: ./.github/workflows/javadoc.yml

  check-missing-javadoc:
    needs: check-workflows
    uses: ./.github/workflows/check-missing-javadoc.yml

  windows-build:
    needs: check-workflows
    uses: ./.github/workflows/windows-build.yml
    with:
      upload-artifacts: true

  windows-test:
    needs: windows-build
    strategy:
       matrix:
         test_name: ["IC", "IF", "IX", "NC", "OB", "RL", "SG", "SM", "SQ", "ST"]
    uses: ./.github/workflows/windows-test.yml
    with:
      test-name: ${{ matrix.test_name }}

  windows-generate-test-scripts:
    needs: check-workflows
    uses: ./.github/workflows/windows-generate-test-scripts.yml

  windows-test-other:
    needs: [windows-build, windows-generate-test-scripts]
    strategy:
      fail-fast: false
      matrix:
        test_name:
          - "command-line-options"
          - "data-rep"
          - "jp-compat"
          - "run"
          - "syntax"
          - "file-lock"
          - "file-lock2"
          - "file-lock3"
          - "file-lock4"
          - "file-lock5"
          - "misc"
          - "multithread"
    uses: ./.github/workflows/windows-test-other.yml
    with:
      test-name: ${{ matrix.test_name }}

  # esql-utf8 is missing on purpose: it needs a compiler configured with
  # --enable-utf8, and the Windows build is Shift_JIS only.
  windows-test-esql:
    needs: [windows-build, windows-generate-test-scripts]
    strategy:
      fail-fast: false
      matrix:
        test_name:
          - "esql-basic"
          - "esql-sqlca"
          - "esql-cobol-data"
          - "esql-misc"
          - "esql-sql-data"
          - "esql-multithread"
    uses: ./.github/workflows/windows-test-esql.yml
    with:
      test-name: ${{ matrix.test_name }}

  static-analysis:
    needs: check-workflows
    uses: ./.github/workflows/static-analysis.yml

  check-dev-container:
    needs: check-workflows
    uses: ./.github/workflows/check-dev-container.yml
